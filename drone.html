<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BADMOSH AI - Drone Control</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <div class="logo">⚡ BADMOSH AI</div>
        <div class="status">
            <span class="dot"></span>
            DRONE CONNECTED
        </div>
    </header>

    <main>

        <!-- LEFT PANEL -->
        <section class="sidebar">

            <div class="card">
                <h2>🚁 DRONE</h2>

                <p>Status: <span class="green">ONLINE</span></p>
                <p>Battery: <strong>87%</strong></p>
                <p>Signal: <strong>4G</strong></p>
                <p>GPS: <span class="green">CONNECTED</span></p>
            </div>

            <div class="card">
                <h2>MODE</h2>

                <button id="manualBtn" class="mode active">
                    🎮 MANUAL
                </button>

                <button id="autoBtn" class="mode">
                    🤖 AUTO
                </button>
            </div>

            <div class="card">
                <h2>🎮 CONTROLS</h2>

                <div class="controls">
                    <button>⬆️</button>

                    <div>
                        <button>⬅️</button>
                        <button>⏹️</button>
                        <button>➡️</button>
                    </div>

                    <button>⬇️</button>
                </div>
            </div>

        </section>


        <!-- MAP -->
        <section class="map-section">

            <div class="map-header">
                <h2>🇮🇳 INDIA MAP</h2>

                <button id="locationBtn">
                    📍 Locate Drone
                </button>
            </div>

            <div id="map">
                <div class="map-message">
                    INDIA MAP<br>
                    <small>Map will be connected in the next step</small>
                </div>

                <div id="droneMarker">🚁</div>
            </div>

        </section>

    </main>


    <!-- AI PANEL -->
    <section class="ai-panel">

        <div class="ai-title">
            🤖 BADMOSH AI
        </div>

        <div id="chat">
            <div class="bot-message">
                Hello! I am Badmosh AI. Ready for your command.
            </div>
        </div>

        <div class="chat-controls">

            <button id="micBtn">🎤</button>

            <input
                type="text"
                id="message"
                placeholder="Talk to Badmosh AI..."
            >

            <button id="sendBtn">➤</button>

            <button id="speakerBtn">🔊</button>

        </div>

    </section>


    <!-- MEDIA CONTROLS -->
    <section class="media-controls">

        <button id="photoBtn">
            📷 PHOTO
        </button>

        <button id="recordBtn">
            🎥 RECORD
        </button>

        <button id="listenBtn">
            🎧 LISTEN
        </button>

        <button id="emergencyBtn" class="emergency">
            🛑 SAFETY STOP
        </button>

    </section>


    <script src="script.js"></script>

</body>
</html>
