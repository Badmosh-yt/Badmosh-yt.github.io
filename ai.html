<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Badmosh AI</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #08050f;
    color: white;
}

header {
    padding: 22px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid #24183a;
}

.logo {
    font-size: 24px;
    font-weight: bold;
    color: #a855f7;
}

nav a {
    color: white;
    text-decoration: none;
    margin-left: 20px;
}

.hero {
    text-align: center;
    padding: 80px 20px 40px;
}

.hero h1 {
    font-size: 55px;
    margin-bottom: 15px;
}

.hero h1 span {
    color: #a855f7;
}

.hero p {
    color: #b8b0c7;
    font-size: 18px;
}

.chat-box {
    max-width: 750px;
    margin: 40px auto;
    background: #120c1d;
    border: 1px solid #2d2040;
    border-radius: 18px;
    padding: 20px;
}

.chat-box input {
    width: 78%;
    padding: 16px;
    border-radius: 10px;
    border: none;
    outline: none;
    background: #21162e;
    color: white;
}

.chat-box button {
    width: 19%;
    padding: 16px;
    border: none;
    border-radius: 10px;
    background: #8b5cf6;
    color: white;
    font-weight: bold;
    cursor: pointer;
}

#response {
    margin-top: 20px;
    padding: 15px;
    background: #0c0812;
    border-radius: 10px;
    color: #ddd;
    min-height: 50px;
}

.plans {
    max-width: 900px;
    margin: 70px auto;
    padding: 20px;
    display: flex;
    gap: 25px;
    justify-content: center;
}

.plan {
    width: 350px;
    padding: 30px;
    background: #120c1d;
    border: 1px solid #2d2040;
    border-radius: 18px;
}

.plan.pro {
    border: 2px solid #a855f7;
}

.plan h2 {
    margin-bottom: 15px;
}

.price {
    font-size: 30px;
    font-weight: bold;
    margin: 15px 0;
}

.plan ul {
    list-style: none;
    line-height: 2;
    color: #cfc6da;
}

.plan button {
    width: 100%;
    margin-top: 20px;
    padding: 14px;
    border: none;
    border-radius: 10px;
    background: #8b5cf6;
    color: white;
    font-weight: bold;
}

footer {
    text-align: center;
    padding: 30px;
    color: #777;
}

@media(max-width:700px) {
    .hero h1 {
        font-size: 40px;
    }

    .plans {
        flex-direction: column;
        align-items: center;
    }

    .plan {
        width: 90%;
    }

    .chat-box input {
        width: 68%;
    }

    .chat-box button {
        width: 29%;
    }
}
</style>
</head>

<body>

<header>

<div class="logo">🤖 BADMOSH AI</div>

<nav>
<a href="index.html">Books</a>
<a href="#plans">Plans</a>
</nav>

</header>


<section class="hero">

<h1>Meet <span>Badmosh AI</span></h1>

<p>Your AI assistant for technology, coding, Minecraft and more.</p>

<div class="chat-box">

<input
id="question"
type="text"
placeholder="Ask Badmosh AI..."
>

<button onclick="askAI()">Send</button>

<div
