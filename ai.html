<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Badmosh AI</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --bg:#08070b;
    --sidebar:#0d0b12;
    --panel:#121018;
    --panel2:#18151f;
    --border:#292431;
    --purple:#9b5cff;
    --purple2:#7c3aed;
    --text:#f5f3f7;
    --muted:#aaa5b3;
    --danger:#f87171;
    --green:#4ade80;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:var(--bg);
    color:var(--text);
    height:100vh;
    overflow:hidden;
}

/* APP */

.app{
    display:flex;
    height:100vh;
}

/* SIDEBAR */

.sidebar{
    width:270px;
    background:var(--sidebar);
    border-right:1px solid var(--border);
    display:flex;
    flex-direction:column;
    flex-shrink:0;
    transition:.25s;
}

.sidebar-header{
    padding:18px;
    border-bottom:1px solid var(--border);
}

.brand{
    font-size:21px;
    font-weight:900;
    margin-bottom:15px;
}

.brand span{
    color:var(--purple);
}

.new-chat{
    width:100%;
    padding:12px;
    border:1px solid var(--border);
    border-radius:10px;
    background:var(--panel2);
    color:white;
    cursor:pointer;
    font-weight:bold;
    text-align:left;
}

.new-chat:hover{
    border-color:var(--purple);
    background:#20182b;
}

/* NAV */

.side-nav{
    padding:12px;
    overflow-y:auto;
    flex:1;
}

.nav-button{
    width:100%;
    display:flex;
    align-items:center;
    gap:12px;
    padding:11px 12px;
    margin-bottom:4px;
    border:0;
    border-radius:9px;
    background:transparent;
    color:#ddd8e2;
    cursor:pointer;
    text-align:left;
    font-size:14px;
}

.nav-button:hover{
    background:#1a1620;
}

.nav-button.active{
    background:#21172f;
    color:white;
}

.icon{
    width:20px;
    text-align:center;
}

.section-label{
    color:#77717e;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:1px;
    margin:18px 10px 8px;
}

/* HISTORY */

.history-list{
    display:flex;
    flex-direction:column;
    gap:3px;
}

.history-item{
    display:flex;
    align-items:center;
    gap:5px;
    border-radius:8px;
    padding:8px 7px 8px 10px;
    cursor:pointer;
}

.history-item:hover{
    background:#19151e;
}

.history-item.active{
    background:#21172f;
}

.history-title{
    flex:1;
    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
    font-size:13px;
}

.history-actions{
    display:flex;
    gap:2px;
}

.history-action{
    background:transparent;
    border:0;
    color:#817b88;
    cursor:pointer;
    padding:4px;
    border-radius:5px;
}

.history-action:hover{
    background:#302838;
    color:white;
}

/* SIDEBAR BOTTOM */

.sidebar-bottom{
    padding:12px;
    border-top:1px solid var(--border);
}

.plan{
    padding:13px;
    background:var(--panel2);
    border:1px solid var(--border);
    border-radius:12px;
}

.plan-title{
    font-weight:bold;
    font-size:14px;
}

.plan-text{
    color:var(--muted);
    font-size:12px;
    margin-top:5px;
}

.upgrade{
    margin-top:10px;
    width:100%;
    padding:9px;
    border:0;
    border-radius:8px;
    background:var(--purple2);
    color:white;
    font-weight:bold;
    cursor:pointer;
}

/* MAIN */

.main{
    flex:1;
    min-width:0;
    display:flex;
    flex-direction:column;
}

/* TOP BAR */

.topbar{
    height:62px;
    border-bottom:1px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 20px;
    background:rgba(8,7,11,.9);
}

.top-left{
    display:flex;
    align-items:center;
    gap:10px;
}

.menu-button{
    display:none;
    border:0;
    background:transparent;
    color:white;
    font-size:22px;
    cursor:pointer;
}

.page-title{
    font-weight:bold;
}

.status{
    color:var(--green);
    font-size:12px;
}

/* CONTENT */

.content{
    flex:1;
    min-height:0;
    overflow-y:auto;
}

/* CHAT */

.chat-page{
    height:100%;
    display:flex;
    flex-direction:column;
}

.chat{
    flex:1;
    overflow-y:auto;
    padding:30px;
}

.welcome{
    max-width:750px;
    margin:70px auto 30px;
    text-align:center;
}

.welcome-logo{
    width:70px;
    height:70px;
    display:flex;
    align-items:center;
    justify-content:center;
    margin:auto;
    border-radius:20px;
    background:linear-gradient(135deg,var(--purple2),var(--purple));
    font-size:35px;
    box-shadow:0 15px 50px #7c3aed44;
}

.welcome h1{
    margin-top:22px;
    font-size:42px;
}

.welcome h1 span{
    color:var(--purple);
}

.welcome p{
    color:var(--muted);
    margin-top:12px;
    line-height:1.6;
}

.messages{
    max-width:850px;
    margin:auto;
}

.message{
    display:flex;
    gap:12px;
    margin:22px 0;
}

.message.user{
    justify-content:flex-end;
}

.message-box{
    max-width:75%;
    padding:14px 16px;
    border-radius:15px;
    line-height:1.6;
    white-space:pre-wrap;
    overflow-wrap:anywhere;
}

.bot .message-box{
    background:var(--panel);
    border:1px solid var(--border);
}

.user .message-box{
    background:var(--purple2);
}

.avatar{
    width:34px;
    height:34px;
    border-radius:10px;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
    background:#241936;
}

/* COMPOSER */

.composer-area{
    padding:15px 25px 20px;
}

.composer{
    max-width:850px;
    margin:auto;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:17px;
    box-shadow:0 10px 40px #00000055;
}

.attachments{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    padding:8px 12px 0;
}

.attachment{
    background:#211b29;
    border:1px solid var(--border);
    border-radius:8px;
    padding:6px 9px;
    font-size:12px;
}

.composer-row{
    display:flex;
    gap:8px;
    padding:10px;
}

.composer input{
    flex:1;
    min-width:0;
    background:transparent;
    border:0;
    outline:0;
    color:white;
    font-size:15px;
    padding:8px;
}

.composer button{
    width:42px;
    height:42px;
    border:0;
    border-radius:10px;
    cursor:pointer;
}

.attach{
    background:#211c27;
    color:white;
}

.send{
    background:var(--purple2);
    color:white;
    font-size:18px;
}

.send:disabled{
    opacity:.4;
    cursor:not-allowed;
}

.disclaimer{
    max-width:850px;
    margin:8px auto 0;
    text-align:center;
    color:#66616c;
    font-size:11px;
}

/* PAGES */

.tool-page{
    padding:35px;
    max-width:1000px;
    margin:auto;
}

.tool-page h1{
    font-size:32px;
}

.tool-page-subtitle{
    color:var(--muted);
    margin-top:8px;
}

.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(210px,1fr));
    gap:15px;
    margin-top:28px;
}

.card{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:15px;
    padding:22px;
}

.card:hover{
    border-color:#49355d;
}

.card-icon{
    font-size:30px;
    margin-bottom:14px;
}

.card h3{
    margin-bottom:8px;
}

.card p{
    color:var(--muted);
    font-size:13px;
    line-height:1.5;
}

.card button{
    margin-top:15px;
    padding:9px 13px;
    border:1px solid var(--border);
    background:var(--panel2);
    color:white;
    border-radius:8px;
    cursor:pointer;
}

/* CODEX */

.code-editor{
    margin-top:25px;
    background:#09080c;
    border:1px solid var(--border);
    border-radius:13px;
    overflow:hidden;
}

.code-toolbar{
    padding:10px 12px;
    border-bottom:1px solid var(--border);
    display:flex;
    justify-content:space-between;
}

.code-editor textarea{
    width:100%;
    min-height:330px;
    resize:vertical;
    background:#09080c;
    color:#ddd;
    border:0;
    outline:0;
    padding:18px;
    font-family:Consolas,monospace;
    font-size:13px;
}

.run-code{
    background:var(--purple2);
    color:white;
    border:0;
    border-radius:7px;
    padding:8px 12px;
    cursor:pointer;
}

/* MODAL */

.modal{
    position:fixed;
    inset:0;
    background:#00000099;
    display:none;
    align-items:center;
    justify-content:center;
    z-index:1000;
    padding:20px;
}

.modal.show{
    display:flex;
}

.modal-box{
    width:100%;
    max-width:520px;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:18px;
    padding:25px;
}

.modal-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.close{
    background:transparent;
    border:0;
    color:#aaa;
    font-size:22px;
    cursor:pointer;
}

.plan-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    margin-top:20px;
}

.plan-option{
    border:1px solid var(--border);
    background:var(--panel2);
    border-radius:12px;
    padding:15px;
    cursor:pointer;
}

.plan-option:hover{
    border-color:var(--purple);
}

.plan-option strong{
    display:block;
    margin-bottom:7px;
}

.plan-option span{
    color:var(--muted);
    font-size:12px;
}

/* TOAST */

.toast{
    position:fixed;
    right:20px;
    bottom:20px;
    background:#211b29;
    border:1px solid var(--border);
    padding:12px 16px;
    border-radius:10px;
    display:none;
    z-index:2000;
}

.toast.show{
    display:block;
}

/* MOBILE */

@media(max-width:800px){

    .sidebar{
        position:fixed;
        left:-280px;
        top:0;
        bottom:0;
        z-index:900;
    }

    .sidebar.open{
        left:0;
    }

    .menu-button{
        display:block;
    }

    .welcome{
        margin-top:45px;
    }

    .welcome h1{
        font-size:32px;
    }

    .chat{
        padding:20px 14px;
    }

    .message-box{
        max-width:85%;
    }

    .composer-area{
        padding:10px;
    }

    .tool-page{
        padding:25px 16px;
    }

    .plan-grid{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<body>

<div class="app">

<!-- SIDEBAR -->

<aside class="sidebar" id="sidebar">

    <div class="sidebar-header">

        <div class="brand">
            🤖 BADMOSH <span>AI</span>
        </div>

        <button class="new-chat" onclick="newChat()">
            ＋ New chat
        </button>

    </div>


    <div class="side-nav">

        <button class="nav-button active" data-page="chat" onclick="openPage('chat',this)">
            <span class="icon">💬</span>
            <span>Chat</span>
        </button>

        <button class="nav-button" data-page="images" onclick="openPage('images',this)">
            <span class="icon">🖼️</span>
            <span>Images</span>
        </button>

        <button class="nav-button" data-page="library" onclick="openPage('library',this)">
            <span class="icon">📚</span>
            <span>Library</span>
        </button>

        <button class="nav-button" data-page="projects" onclick="openPage('projects',this)">
            <span class="icon">📂</span>
            <span>Projects</span>
        </button>

        <button class="nav-button" data-page="codex" onclick="openPage('codex',this)">
            <span class="icon">💻</span>
            <span>Codex</span>
        </button>

        <button class="nav-button" data-page="plugins" onclick="openPage('plugins',this)">
            <span class="icon">🧩</span>
            <span>Plugins</span>
        </button>


        <div class="section-label">
            History
        </div>

        <div class="history-list" id="historyList"></div>

        <button class="nav-button" onclick="clearHistory()">
            <span class="icon">🗑️</span>
            <span>Clear history</span>
        </button>

    </div>


    <div class="sidebar-bottom">

        <div class="plan">

            <div class="plan-title" id="currentPlan">
                Free plan
            </div>

            <div class="plan-text">
                Basic Badmosh AI access
            </div>

            <button class="upgrade" onclick="showPlans()">
                View plans
            </button>

        </div>

    </div>

</aside>


<!-- MAIN -->

<main class="main">

    <header class="topbar">

        <div class="top-left">

            <button class="menu-button" onclick="toggleSidebar()">
                ☰
            </button>

            <div class="page-title" id="pageTitle">
                Badmosh AI
            </div>

        </div>

        <div class="status">
            ● Online
        </div>

    </header>


    <div class="content" id="content"></div>

</main>

</div>


<!-- PLAN MODAL -->

<div class="modal" id="planModal">

    <div class="modal-box">

        <div class="modal-header">

            <h2>Badmosh AI Plans</h2>

            <button class="close" onclick="closePlans()">×</button>

        </div>

        <div class="plan-grid">

            <div class="plan-option" onclick="selectPlan('Free')">
                <strong>Free</strong>
                <span>Basic access</span>
            </div>

            <div class="plan-option" onclick="selectPlan('Starter')">
                <strong>Starter</strong>
                <span>More AI usage</span>
            </div>

            <div class="plan-option" onclick="selectPlan('Pro')">
                <strong>Pro</strong>
                <span>Advanced access</span>
            </div>

        </div>

    </div>

</div>


<!-- FILE INPUT -->

<input
    type="file"
    id="fileInput"
    multiple
    hidden
    accept="image/*,.pdf,.txt,.doc,.docx,.js,.html,.css,.json,.py"
>


<div class="toast" id="toast"></div>


<script>

/* =========================================================
   CONFIG
========================================================= */

/*
   Put your real Badmosh AI Worker URL here.

   Do NOT put secret API keys in this HTML file.
*/

const WORKER_URL =
    "https://badmosh-ai.cchandasaini.workers.dev/";


/* =========================================================
   STATE
========================================================= */

let chats = JSON.parse(
    localStorage.getItem("badmoshChats") || "[]"
);

let currentChatId = null;

let attachedFiles = [];


/* =========================================================
   SAVE
========================================================= */

function saveChats(){

    localStorage.setItem(
        "badmoshChats",
        JSON.stringify(chats)
    );

}


/* =========================================================
   ID
========================================================= */

function makeId(){

    return Date.now().toString() +
        Math.random().toString(36).slice(2);

}


/* =========================================================
   INIT
========================================================= */

document.addEventListener("DOMContentLoaded",function(){

    renderHistory();

    newChat();

});


/* =========================================================
   SIDEBAR
========================================================= */

function toggleSidebar(){

    document
        .getElementById("sidebar")
        .classList.toggle("open");

}


/* =========================================================
   PAGE NAVIGATION
========================================================= */

function openPage(page,button){

    document
        .querySelectorAll(".nav-button")
        .forEach(function(item){

            item.classList.remove("active");

        });


    if(button){
        button.classList.add("active");
    }


    const titles = {

        chat:"Badmosh AI",

        images:"Images",

        library:"Library",

        projects:"Projects",

        codex:"Codex",

        plugins:"Plugins"

    };


    document.getElementById("pageTitle").textContent =
        titles[page] || "Badmosh AI";


    if(page === "chat"){
        renderChat();
    }

    if(page === "images"){
        renderImages();
    }

    if(page === "library"){
        renderLibrary();
    }

    if(page === "projects"){
        renderProjects();
    }

    if(page === "codex"){
        renderCodex();
    }

    if(page === "plugins"){
        renderPlugins();
    }


    if(window.innerWidth <= 800){

        document
            .getElementById("sidebar")
            .classList.remove("open");

    }

}


/* =========================================================
   NEW CHAT
========================================================= */

function newChat(){

    const chat = {

        id:makeId(),

        title:"New chat",

        pinned:false,

        createdAt:Date.now(),

        messages:[]

    };


    chats.unshift(chat);

    currentChatId = chat.id;

    saveChats();

    renderHistory();

    renderChat();

}


/* =========================================================
   CURRENT CHAT
========================================================= */

function getCurrentChat(){

    return chats.find(function(chat){

        return chat.id === currentChatId;

    });

}


/* =========================================================
   RENDER HISTORY
========================================================= */

function renderHistory(){

    const list =
        document.getElementById("historyList");

    list.innerHTML = "";


    const sorted = [...chats].sort(function(a,b){

        if(a.pinned !== b.pinned){

            return a.pinned ? -1 : 1;

        }

        return b.createdAt - a.createdAt;

    });


    sorted.forEach(function(chat){

        const item =
            document.createElement("div");

        item.className =
            "history-item" +
            (chat.id === currentChatId ? " active" : "");


        const title =
            document.createElement("div");

        title.className =
            "history-title";

        title.textContent =
            (chat.pinned ? "📌 " : "") +
            chat.title;


        title.onclick = function(){

            currentChatId = chat.id;

            renderHistory();

            renderChat();

        };


        const actions =
            document.createElement("div");

        actions.className =
            "history-actions";


        const pin =
            document.createElement("button");

        pin.className =
            "history-action";

        pin.title =
            chat.pinned
                ? "Unpin"
                : "Pin";

        pin.textContent =
            chat.pinned
                ? "📌"
                : "☆";


        pin.onclick = function(event){

            event.stopPropagation();

            chat.pinned =
                !chat.pinned;

            saveChats();

            renderHistory();

        };


        const del =
            document.createElement("button");

        del.className =
            "history-action";

        del.title =
            "Delete";

        del.textContent =
            "×";


        del.onclick = function(event){

            event.stopPropagation();

            deleteChat(chat.id);

        };


        actions.appendChild(pin);

        actions.appendChild(del);

        item.appendChild(title);

        item.appendChild(actions);

        list.appendChild(item);

    });

}


/* =========================================================
   DELETE CHAT
========================================================= */

function deleteChat(id){

    chats =
        chats.filter(function(chat){

            return chat.id !== id;

        });


    if(chats.length === 0){

        newChat();

        return;

    }


    if(currentChatId === id){

        currentChatId =
            chats[0].id;

    }


    saveChats();

    renderHistory();

    renderChat();

}


/* =========================================================
   CLEAR HISTORY
========================================================= */

function clearHistory(){

    if(!confirm(
        "Clear all Badmosh AI chat history?"
    )){
        return;
    }


    localStorage.removeItem(
        "badmoshChats"
    );


    chats = [];

    newChat();

    showToast(
        "Chat history cleared"
    );

}


/* =========================================================
   RENDER CHAT
========================================================= */

function renderChat(){

    const content =
        document.getElementById("content");


    content.innerHTML = `

        <div class="chat-page">

            <div class="chat" id="chatArea">

                <div class="welcome" id="welcome">

                    <div class="welcome-logo">
                        🤖
                    </div>

                    <h1>
                        Welcome to <span>Badmosh AI</span>
                    </h1>

                    <p>
                        Ask questions, write code, learn,
                        brainstorm ideas and more.
                    </p>

                </div>

                <div class="messages" id="messages"></div>

            </div>


            <div class="composer-area">

                <div class="composer">

                    <div
                        class="attachments"
                        id="attachments">
                    </div>

                    <div class="composer-row">

                        <button
                            class="attach"
                            onclick="chooseFile()"
                            title="Upload files">

                            📎

                        </button>

                        <input
                            id="question"
                            placeholder="Message Badmosh AI..."
                            autocomplete="off"
                        >

                        <button
                            class="send"
                            id="sendButton"
                            onclick="sendAI()">

                            ➤

                        </button>

                    </div>

                </div>

                <div class="disclaimer">
                    Badmosh AI can make mistakes. Check important information.
                </div>

            </div>

        </div>
    `;


    const chat =
        getCurrentChat();


    if(chat && chat.messages.length){

        document.getElementById(
            "welcome"
        ).style.display = "none";


        chat.messages.forEach(function(message){

            addMessageToScreen(
                message.role,
                message.content
            );

        });

    }


    const input =
        document.getElementById("question");


    input.addEventListener(
        "keydown",
        function(event){

            if(event.key === "Enter"){

                event.preventDefault();

                sendAI();

            }

        }
    );


    renderAttachments();

}


/* =========================================================
   MESSAGE
========================================================= */

function addMessageToScreen(role,content){

    const messages =
        document.getElementById("messages");


    if(!messages){
        return;
    }


    const wrapper =
        document.createElement("div");

    wrapper.className =
        "message " +
        (role === "user"
            ? "user"
            : "bot");


    const avatar =
        document.createElement("div");

    avatar.className =
        "avatar";

    avatar.textContent =
        role === "user"
            ? "👤"
            : "🤖";


    const box =
        document.createElement("div");

    box.className =
        "message-box";

    box.textContent =
        content;


    if(role === "user"){

        wrapper.appendChild(box);

        wrapper.appendChild(avatar);

    }else{

        wrapper.appendChild(avatar);

        wrapper.appendChild(box);

    }


    messages.appendChild(wrapper);


    const area =
        document.getElementById("chatArea");

    if(area){

        area.scrollTop =
            area.scrollHeight;

    }

}


/* =========================================================
   SEND AI
========================================================= */

async function sendAI(){

    const input =
        document.getElementById("question");

    const button =
        document.getElementById("sendButton");


    if(!input || !button){
        return;
    }


    const question =
        input.value.trim();


    if(!question){
        return;
    }


    const chat =
        getCurrentChat();


    if(!chat){
        return;
    }


    input.value = "";

    button.disabled = true;


    document.getElementById(
        "welcome"
    ).style.display = "none";


    chat.messages.push({

        role:"user",

        content:question

    });


    if(chat.title === "New chat"){

        chat.title =
            question.length > 35
                ? question.slice(0,35) + "..."
                : question;

    }


    addMessageToScreen(
        "user",
        question
    );


    saveChats();

    renderHistory();


    const thinking =
        document.createElement("div");

    thinking.className =
        "message bot";

    thinking.innerHTML = `

        <div class="avatar">
            🤖
        </div>

        <div class="message-box">
            Thinking... 🤔
        </div>

    `;


    document.getElementById(
        "messages"
    ).appendChild(thinking);


    try{

        const response =
            await fetch(
                WORKER_URL,
                {

                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:JSON.stringify({

                        question:question

                    })

                }
            );


        const data =
            await response.json();


        if(!response.ok){

            throw new Error(
                data.error ||
                "AI request failed."
            );

        }


        let answer = "";


        if(
            data.choices &&
            data.choices[0] &&
            data.choices[0].message
        ){

            answer =
                data.choices[0]
                    .message
                    .content || "";

        }


        if(!answer){

            answer =
                data.response ||
                data.answer ||
                data.content ||
                "";

        }


        if(!answer){

            throw new Error(
                "No AI response received."
            );

        }


        thinking.remove();


        chat.messages.push({

            role:"assistant",

            content:answer

        });


        addMessageToScreen(
            "assistant",
            answer
        );


        saveChats();


    }catch(error){

        thinking.remove();


        const errorText =
            "Sorry, I couldn't connect to Badmosh AI right now.\n\n" +
            error.message;


        chat.messages.push({

            role:"assistant",

            content:errorText

        });


        addMessageToScreen(
            "assistant",
            errorText
        );


        saveChats();

    }


    button.disabled = false;

    input.focus();

}


/* =========================================================

========================================================= */

function chooseFile(){

    document
        .getElementById("fileInput")
        .click();

}


document
    .getElementById("fileInput")
    .addEventListener(
        "change",
        function(){

            attachedFiles =
                Array.from(this.files);

            renderAttachments();

            showToast(
                attachedFiles.length +
                " file(s) selected"
            );

        }
    );


function renderAttachments(){

    const area =
        document.getElementById(
            "attachments"
        );


    if(!area){
        return;
    }


    area.innerHTML = "";


    attachedFiles.forEach(function(file,index){

        const item =
            document.createElement("div");

        item.className =
            "attachment";


        item.innerHTML =
            "📎 " +
            escapeHTML(file.name) +
            " ";


        const remove =
            document.createElement("button");

        remove.textContent =
            "×";

        remove.style.cssText =
            "background:none;border:0;color:#aaa;cursor:pointer";


        remove.onclick = function(){

            attachedFiles.splice(
                index,
                1
            );

            renderAttachments();

        };


        item.appendChild(remove);

        area.appendChild(item);

    });

}

/* =========================================================
   TOAST
========================================================= */

function showToast(message){

    const toast =
        document.getElementById(
            "toast"
        );


    toast.textContent =
        message;


    toast.classList.add("show");


    setTimeout(function(){

        toast.classList.remove(
            "show"
        );

    },2500);

}


/* =========================================================
   SECURITY
========================================================= */

function escapeHTML(text){

    const div =
        document.createElement("div");

    div.textContent =
        text == null
            ? ""
            : String(text);

    return div.innerHTML;

}
