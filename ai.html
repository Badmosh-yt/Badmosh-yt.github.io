<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Badmosh AI</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
    --bg:#08060d;
    --sidebar:#0d0914;
    --panel:#12101a;
    --panel2:#181421;
    --border:#292333;
    --purple:#9b5cff;
    --purple2:#7c3aed;
    --text:#f5f3f7;
    --muted:#a9a2b3;
    --danger:#f87171;
    --green:#4ade80;
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    height:100vh;
    overflow:hidden;
}

/* APP */

.app{
    display:flex;
    height:100vh;
}

/* SIDEBAR */

.sidebar{
    width:280px;
    background:var(--sidebar);
    border-right:1px solid var(--border);
    display:flex;
    flex-direction:column;
    padding:15px;
    transition:.25s;
}

.brand{
    display:flex;
    align-items:center;
    gap:10px;
    padding:10px;
    margin-bottom:15px;
    font-size:19px;
    font-weight:900;
}

.brand span{
    color:var(--purple);
}

.new-chat{
    width:100%;
    padding:13px;
    border:1px solid var(--border);
    border-radius:10px;
    background:var(--panel2);
    color:white;
    cursor:pointer;
    text-align:left;
    font-weight:bold;
    margin-bottom:12px;
}

.new-chat:hover{
    border-color:var(--purple);
    background:#21172e;
}

/* MENU */

.menu{
    display:flex;
    flex-direction:column;
    gap:4px;
}

.menu-button{
    width:100%;
    border:none;
    background:transparent;
    color:var(--text);
    padding:11px;
    border-radius:9px;
    cursor:pointer;
    text-align:left;
    font-size:14px;
}

.menu-button:hover{
    background:var(--panel2);
}

.menu-button.active{
    background:#21172e;
    color:#cba9ff;
}

/* HISTORY */

.history-title{
    margin-top:20px;
    margin-bottom:8px;
    padding:0 10px;
    color:var(--muted);
    font-size:12px;
    text-transform:uppercase;
}

.history{
    flex:1;
    overflow-y:auto;
}

.chat-item{
    display:flex;
    align-items:center;
    gap:5px;
    margin-bottom:3px;
}

.chat-open{
    flex:1;
    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
    border:none;
    background:transparent;
    color:#ddd7e5;
    padding:9px;
    border-radius:8px;
    text-align:left;
    cursor:pointer;
}

.chat-open:hover{
    background:var(--panel2);
}

.chat-actions{
    display:flex;
}

.chat-actions button{
    border:none;
    background:transparent;
    color:var(--muted);
    cursor:pointer;
    padding:5px;
}

.chat-actions button:hover{
    color:white;
}

/* BOTTOM */

.sidebar-bottom{
    border-top:1px solid var(--border);
    padding-top:10px;
}

.account{
    display:flex;
    align-items:center;
    gap:10px;
    padding:10px;
    color:var(--muted);
    font-size:13px;
}

.account strong{
    color:white;
}

.logout{
    width:100%;
    border:1px solid var(--border);
    background:transparent;
    color:var(--muted);
    padding:9px;
    border-radius:8px;
    cursor:pointer;
}

.logout:hover{
    color:var(--danger);
    border-color:var(--danger);
}

/* MAIN */

.main{
    flex:1;
    display:flex;
    flex-direction:column;
    min-width:0;
}

/* TOPBAR */

.topbar{
    height:60px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 20px;
    border-bottom:1px solid var(--border);
}

.top-title{
    font-weight:bold;
}

.mobile-menu{
    display:none;
    border:none;
    background:transparent;
    color:white;
    font-size:22px;
}

/* CHAT */

.chat{
    flex:1;
    overflow-y:auto;
    padding:30px 20px 130px;
}

.chat-inner{
    max-width:850px;
    margin:auto;
}

.welcome{
    text-align:center;
    padding:90px 20px 40px;
}

.welcome-icon{
    font-size:55px;
    margin-bottom:15px;
}

.welcome h1{
    font-size:42px;
}

.welcome h1 span{
    color:var(--purple);
}

.welcome p{
    color:var(--muted);
    margin-top:12px;
}

/* MESSAGE */

.message{
    display:flex;
    margin-bottom:22px;
}

.message.user{
    justify-content:flex-end;
}

.message-content{
    max-width:78%;
    padding:14px 16px;
    border-radius:14px;
    line-height:1.6;
    word-break:break-word;
}

.message.bot .message-content{
    background:var(--panel);
    border:1px solid var(--border);
}

.message.user .message-content{
    background:var(--purple2);
}

/* COMPOSER */

.composer-area{
    position:absolute;
    bottom:0;
    left:280px;
    right:0;
    padding:15px 20px 20px;
    background:linear-gradient(
        transparent,
        var(--bg) 25%
    );
}

.composer{
    max-width:850px;
    margin:auto;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:17px;
    padding:10px;
}

.attachments{
    display:flex;
    gap:8px;
    margin-bottom:8px;
}

.attach-button{
    border:1px solid var(--border);
    background:var(--panel2);
    color:var(--muted);
    border-radius:8px;
    padding:7px 10px;
    cursor:pointer;
}

.attach-button:hover{
    color:white;
    border-color:var(--purple);
}

.file-input{
    display:none;
}

.input-row{
    display:flex;
    gap:8px;
}

.input{
    flex:1;
    border:none;
    outline:none;
    background:transparent;
    color:white;
    font-size:15px;
    padding:12px;
}

.send{
    width:45px;
    height:45px;
    border:none;
    border-radius:11px;
    background:var(--purple2);
    color:white;
    cursor:pointer;
    font-size:18px;
}

.send:hover{
    background:var(--purple);
}

.send:disabled{
    opacity:.5;
}

/* AUTH */

.auth-screen{
    position:fixed;
    inset:0;
    z-index:5000;
    background:
        radial-gradient(circle at top,#26113d,#08060d 60%);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.auth-screen.hidden{
    display:none;
}

.auth-card{
    width:100%;
    max-width:430px;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:20px;
    padding:30px;
    box-shadow:0 20px 80px #0008;
}

.auth-logo{
    text-align:center;
    font-size:30px;
    font-weight:900;
    margin-bottom:8px;
}

.auth-logo span{
    color:var(--purple);
}

.auth-subtitle{
    text-align:center;
    color:var(--muted);
    margin-bottom:25px;
}

.auth-input{
    width:100%;
    padding:13px;
    margin-bottom:10px;
    background:#0a0710;
    border:1px solid var(--border);
    border-radius:9px;
    color:white;
    outline:none;
}

.auth-input:focus{
    border-color:var(--purple);
}

.auth-button{
    width:100%;
    padding:13px;
    border:none;
    border-radius:9px;
    background:var(--purple2);
    color:white;
    font-weight:bold;
    cursor:pointer;
    margin-top:5px;
}

.auth-button:hover{
    background:var(--purple);
}

.google{
    background:white;
    color:#222;
}

.google:hover{
    background:#eee;
}

.auth-message{
    min-height:20px;
    margin-top:15px;
    font-size:13px;
    text-align:center;
}

.error{
    color:var(--danger);
}

.success{
    color:var(--green);
}

/* MODAL */

.modal{
    position:fixed;
    inset:0;
    background:#0009;
    display:none;
    align-items:center;
    justify-content:center;
    z-index:4000;
}

.modal.show{
    display:flex;
}

.modal-card{
    width:90%;
    max-width:500px;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:18px;
    padding:25px;
}

.modal-card h2{
    margin-bottom:10px;
}

.modal-card p{
    color:var(--muted);
    line-height:1.5;
}

.modal-close{
    margin-top:20px;
    width:100%;
    padding:11px;
    border:1px solid var(--border);
    background:transparent;
    color:white;
    border-radius:8px;
    cursor:pointer;
}

/* MOBILE */

@media(max-width:800px){

    .sidebar{
        position:fixed;
        left:-290px;
        top:0;
        bottom:0;
        z-index:3000;
    }

    .sidebar.open{
        left:0;
    }

    .mobile-menu{
        display:block;
    }

    .composer-area{
        left:0;
    }

    .message-content{
        max-width:90%;
    }

    .welcome h1{
        font-size:32px;
    }
}
</style>
</head>

<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
    "https://evrzjkylpontvngwoszb.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_wSigh2nJLbJRfmDZXTStdA_WETjMZnJ";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );


/* =========================================================
   BADMOSH AI WORKER
========================================================= */

const WORKER_URL =
    "https://badmosh-ai.cchandasaini.workers.dev/";


/* =========================================================
   STATE
========================================================= */

let currentUser = null;

let currentChatId = null;

let chats = [];

let pinnedChats = [];


/* =========================================================
   ELEMENTS
========================================================= */

const authScreen =
    document.getElementById("authScreen");

const authMessage =
    document.getElementById("authMessage");

const question =
    document.getElementById("question");

const messages =
    document.getElementById("messages");

const welcome =
    document.getElementById("welcome");

const history =
    document.getElementById("history");

const pinnedHistory =
    document.getElementById("pinnedHistory");

const accountEmail =
    document.getElementById("accountEmail");

const sendButton =
    document.getElementById("send");


/* =========================================================
   AUTH MESSAGE
========================================================= */

function authMsg(
    text,
    type=""
){

    authMessage.textContent =
        text;

    authMessage.className =
        "auth-message " + type;

}


/* =========================================================
   SIGN UP
========================================================= */

async function signUp(){

    const email =
        document.getElementById("email")
            .value.trim();

    const password =
        document.getElementById("password")
            .value;


    if(!email || !password){

        authMsg(
            "Enter your email and password.",
            "error"
        );

        return;
    }


    if(password.length < 6){

        authMsg(
            "Password must contain at least 6 characters.",
            "error"
        );

        return;
    }


    authMsg(
        "Creating account..."
    );


    const {
        data,
        error
    } =
        await supabaseClient.auth.signUp({

            email,
            password,

            options:{
                emailRedirectTo:
                    window.location.href
            }

        });


    if(error){

        authMsg(
            error.message,
            "error"
        );

        return;
    }


    if(!data.session){

        authMsg(
            "Account created. Check your email to verify it.",
            "success"
        );

    }else{

        authMsg(
            "Account created!",
            "success"
        );

    }

}


/* =========================================================
   SIGN IN
========================================================= */

async function signIn(){

    const email =
        document.getElementById("email")
            .value.trim();

    const password =
        document.getElementById("password")
            .value;


    if(!email || !password){

        authMsg(
            "Enter your email and password.",
            "error"
        );

        return;
    }


    authMsg(
        "Signing in..."
    );


    const {
        data,
        error
    } =
        await supabaseClient.auth.signInWithPassword({

            email,
            password

        });


    if(error){

        authMsg(
            error.message,
            "error"
        );

        return;
    }


    if(data.user){

        showApp(
            data.user
        );

    }

}


/* =========================================================
   GOOGLE
========================================================= */

async function googleSignIn(){

    authMsg(
        "Opening Google..."
    );


    const {
        error
    } =
        await supabaseClient.auth.signInWithOAuth({

            provider:"google",

            options:{
                redirectTo:
                    window.location.href
            }

        });


    if(error){

        authMsg(
            error.message,
            "error"
        );

    }

}


/* =========================================================
   SIGN OUT
========================================================= */

async function signOut(){

    await supabaseClient.auth.signOut();

    currentUser = null;

    currentChatId = null;

    authScreen.classList.remove(
        "hidden"
    );

}


/* =========================================================
   AUTH STATE
========================================================= */

supabaseClient.auth.onAuthStateChange(
    function(
        event,
        session
    ){

        if(session && session.user){

            showApp(
                session.user
            );

        }else{

            currentUser = null;

            authScreen.classList.remove(
                "hidden"
            );

        }

    }
);


/* =========================================================
   SHOW APP
========================================================= */

async function showApp(user){

    currentUser =
        user;


    accountEmail.textContent =
        user.email || "User";


    authScreen.classList.add(
        "hidden"
    );


    await loadChats();

}


/* =========================================================
   NEW CHAT
========================================================= */

function newChat(){

    currentChatId =
        null;


    messages.innerHTML =
        "";


    welcome.style.display =
        "block";


    question.value =
        "";


    document.getElementById(
        "topTitle"
    ).textContent =
        "New chat";


    question.focus();


    closeMobileSidebar();

}


/* =========================================================
   SEND MESSAGE
========================================================= */

async function sendMessage(){

    const text =
        question.value.trim();


    if(!text){

        return;
    }


    addMessage(
        "user",
        text
    );


    question.value =
        "";


    welcome.style.display =
        "none";


    sendButton.disabled =
        true;


    const thinking =
        addMessage(
            "bot",
            "Thinking... 🤔"
        );


    try{

        const response =
            await fetch(
                WORKER_URL,
                {

                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:JSON.stringify({
                        question:text
                    })

                }
            );


        let data;


        try{

            data =
                await response.json();

        }catch{

            throw new Error(
                "Invalid AI response."
            );

        }


        if(!response.ok){

            throw new Error(
                data.error ||
                "AI request failed."
            );

        }


        let answer =
            "";


        if(
            data.choices &&
            data.choices[0] &&
            data.choices[0].message
        ){

            answer =
                data.choices[0]
                    .message
                    .content ||
                "";

        }


        if(!answer)
            answer =
                data.response || "";

        if(!answer)
            answer =
                data.answer || "";

        if(!answer)
            answer =
                data.content || "";


        if(!answer){

            throw new Error(
                "No AI response received."
            );

        }


        thinking.innerHTML =
            formatText(
                answer
            );


        await saveCurrentChat(
            text,
            answer
        );


    }catch(error){

        thinking.innerHTML =
            "❌ " +
            escapeHTML(
                error.message
            );

    }


    sendButton.disabled =
        false;


    question.focus();


    scrollChat();

}


/* =========================================================
   ADD MESSAGE
========================================================= */

function addMessage(
    type,
    text
){

    const message =
        document.createElement("div");


    message.className =
        "message " +
        type;


    const content =
        document.createElement("div");


    content.className =
        "message-content";


    if(type === "user"){

        content.textContent =
            text;

    }else{

        content.innerHTML =
            formatText(
                text
            );

    }


    message.appendChild(
        content
    );


    messages.appendChild(
        message
    );


    scrollChat();


    return content;

}


/* =========================================================
   FORMAT TEXT
========================================================= */

function escapeHTML(text){

    const div =
        document.createElement("div");

    div.textContent =
        String(text ?? "");

    return div.innerHTML;

}


function formatText(text){

    let safe =
        escapeHTML(text);


    safe =
        safe.replace(
            /\*\*(.*?)\*\*/g,
            "<strong>$1</strong>"
        );


    safe =
        safe.replace(
            /\n/g,
            "<br>"
        );


    return safe;

}


/* =========================================================
   SAVE CHAT
========================================================= */

async function saveCurrentChat(
    userText,
    aiText
){

    /*
       This first version stores chats locally.
       Supabase cloud chat storage can be connected
       after the database table is prepared.
    */

    const saved =
        JSON.parse(
            localStorage.getItem(
                "badmosh_chats"
            ) || "[]"
        );


    if(!currentChatId){

        currentChatId =
            Date.now().toString();


        saved.unshift({

            id:
                currentChatId,

            title:
                userText.substring(
                    0,
                    45
                ),

            pinned:false,

            messages:[]

        });

    }


    const chat =
        saved.find(
            item =>
                item.id ===
                currentChatId
        );


    if(chat){

        chat.messages.push({

            role:"user",

            content:userText

        });


        chat.messages.push({

            role:"assistant",

            content:aiText

        });

    }


    localStorage.setItem(
        "badmosh_chats",
        JSON.stringify(saved)
    );


    await loadChats();

}


/* =========================================================
   LOAD CHATS
========================================================= */

async function loadChats(){

    const saved =
        JSON.parse(
            localStorage.getItem(
                "badmosh_chats"
            ) || "[]"
        );


    chats =
        saved;


    pinnedChats =
        saved.filter(
            chat =>
                chat.pinned
        );


    renderHistory();

}


/* =========================================================
   RENDER HISTORY
========================================================= */

function renderHistory(){

    history.innerHTML =
        "";

    pinnedHistory.innerHTML =
        "";


    chats.forEach(
        function(chat){

            const item =
                createChatItem(
                    chat
                );


            history.appendChild(
                item
            );

        }
    );


    pinnedChats.forEach(
        function(chat){

            const item =
                createChatItem(
                    chat,
                    true
                );


            pinnedHistory.appendChild(
                item
            );

        }
    );

}


/* =========================================================
   CHAT ITEM
========================================================= */

function createChatItem(
    chat,
    pinned=false
){

    const wrapper =
        document.createElement("div");


    wrapper.className =
        "chat-item";


    const open =
        document.createElement("button");


    open.className =
        "chat-open";


    open.textContent =
        (pinned ? "📌 " : "") +
        (chat.title || "New chat");


    open.onclick =
        function(){

            openChat(
                chat.id
            );

        };


    const actions =
        document.createElement("div");


    actions.className =
        "chat-actions";


    const pin =
        document.createElement("button");


    pin.textContent =
        chat.pinned
            ? "📌"
            : "☆";


    pin.title =
        "Pin / unpin";


    pin.onclick =
        function(){

            togglePin(
                chat.id
            );

        };


    const del =
        document.createElement("button");


    del.textContent =
        "×";


    del.title =
        "Delete chat";


    del.onclick =
        function(){

            deleteChat(
                chat.id
            );

        };


    actions.appendChild(
        pin
    );

    actions.appendChild(
        del
    );


    wrapper.appendChild(
        open
    );

    wrapper.appendChild(
        actions
    );


    return wrapper;

}


/* =========================================================
   OPEN CHAT
========================================================= */

function openChat(id){

    const chat =
        chats.find(
            item =>
                item.id === id
        );


    if(!chat){

        return;

    }


    currentChatId =
        id;


    messages.innerHTML =
        "";


    welcome.style.display =
        "none";


    document.getElementById(
        "topTitle"
    ).textContent =
        chat.title || "Chat";


    chat.messages.forEach(
        function(message){

            addMessage(
                message.role === "user"
                    ? "user"
                    : "bot",
                message.content
            );

        }
    );


    closeMobileSidebar();

}


/* =========================================================
   PIN CHAT
========================================================= */

function togglePin(id){

    const saved =
        JSON.parse(
            localStorage.getItem(
                "badmosh_chats"
            ) || "[]"
        );


    const chat =
        saved.find(
            item =>
                item.id === id
        );


    if(chat){

        chat.pinned =
            !chat.pinned;

    }


    localStorage.setItem(
        "badmosh_chats",
        JSON.stringify(saved)
    );


    loadChats();

}


/* =========================================================
   DELETE CHAT
========================================================= */

function deleteChat(id){

    if(
        !confirm(
            "Delete this chat?"
        )
    ){

        return;

    }


    let saved =
        JSON.parse(
            localStorage.getItem(
                "badmosh_chats"
            ) || "[]"
        );


    saved =
        saved.filter(
            item =>
                item.id !== id
        );


    localStorage.setItem(
        "badmosh_chats",
        JSON.stringify(saved)
    );


    if(currentChatId === id){

        newChat();

    }


    loadChats();

}


/* =========================================================
   CLEAR ALL
========================================================= */

function clearAllHistory(){

    if(
        !confirm(
            "Delete all Badmosh AI chat history?"
        )
    ){

        return;

    }


    localStorage.removeItem(
        "badmosh_chats"
    );


    chats =
        [];


    pinnedChats =
        [];


    newChat();


    renderHistory();

}

/* =========================================================
   FEATURES
========================================================= */

function openFeature(name){

    document.getElementById(
        "featureTitle"
    ).textContent =
        name;


    const text =
        document.getElementById(
            "featureText"
        );


    const descriptions = {

        "Images":
            "Your Badmosh AI image workspace will appear here.",

        "Library":
            "Your uploaded files, images and saved AI content will appear here.",

        "Scheduled":
            "Scheduled AI tasks will appear here once the scheduling backend is connected.",

        "Plugins":
            "Your Badmosh AI plugins will appear here.",

        "Projects":
            "Create and organize AI projects here.",

        "Codex":
            "Use Badmosh AI for coding and development tasks here.",

        "More":
            "More Badmosh AI tools will appear here.",

        "Image generation":
            "The image-generation interface is ready. The image-generation backend still needs to be connected."

    };


    text.textContent =
        descriptions[name] ||
        "This Badmosh AI feature is ready for connection.";


    document.getElementById(
        "featureModal"
    ).classList.add(
        "show"
    );

}


function closeFeature(){

    document.getElementById(
        "featureModal"
    ).classList.remove(
        "show"
    );

}


/* =========================================================
   SIDEBAR
========================================================= */

function toggleSidebar(){

    document.getElementById(
        "sidebar"
    ).classList.toggle(
        "open"
    );

}


function closeMobileSidebar(){

    document.getElementById(
        "sidebar"
    ).classList.remove(
        "open"
    );

}


/* =========================================================
   SCROLL
========================================================= */

function scrollChat(){

    const chat =
        document.getElementById(
            "chat"
        );


    setTimeout(
        function(){

            chat.scrollTop =
                chat.scrollHeight;

        },
        10
    );

}

   ENTER
========================================================= */

question.addEventListener(
    "keydown",
    function(event){

        if(
            event.key === "Enter"
        ){

            event.preventDefault();

            sendMessage();

        }

    }
);


/* =========================================================
   INITIAL SESSION
========================================================= */

async function initialize(){

    const {
        data,
        error
    } =
        await supabaseClient.auth.getSession();


    if(
        !error &&
        data.session &&
        data.session.user
    ){

        showApp(
            data.session.user
        );

    }

}


initialize();
