<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Badmosh AI</title>

<style>
:root {
    --bg: #07050d;
    --sidebar: #0d0915;
    --panel: #110c1b;
    --border: #292039;
    --purple: #9b5cff;
    --purple2: #7c3aed;
    --text: #f5f3f7;
    --muted: #a9a1b5;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Inter, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    overflow: hidden;
}

/* APP */

.app {
    display: flex;
    height: 100vh;
}

/* SIDEBAR */

.sidebar {
    width: 260px;
    background: var(--sidebar);
    border-right: 1px solid var(--border);
    padding: 18px;
    display: flex;
    flex-direction: column;
}

.logo {
    font-size: 22px;
    font-weight: 800;
    margin-bottom: 25px;
}

.logo span {
    color: var(--purple);
}

.new-chat {
    width: 100%;
    padding: 13px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: #171020;
    color: white;
    cursor: pointer;
    font-size: 14px;
}

.new-chat:hover {
    border-color: var(--purple);
}

.sidebar-title {
    margin-top: 28px;
    margin-bottom: 10px;
    color: var(--muted);
    font-size: 12px;
    text-transform: uppercase;
}

.history {
    color: #d5cfdd;
    font-size: 14px;
    line-height: 2.5;
}

.sidebar-bottom {
    margin-top: auto;
}

.plan {
    padding: 15px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: #120d1d;
}

.plan strong {
    display: block;
    margin-bottom: 5px;
}

.plan p {
    color: var(--muted);
    font-size: 12px;
}

.pro-button {
    margin-top: 12px;
    width: 100%;
    padding: 10px;
    border: none;
    border-radius: 8px;
    background: var(--purple2);
    color: white;
    font-weight: bold;
    cursor: pointer;
}

/* MAIN */

.main {
    flex: 1;
    display: flex;
    flex-direction: column;
}

/* TOPBAR */

.topbar {
    height: 65px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 25px;
}

.model {
    font-weight: 700;
}

.status {
    color: #8d8499;
    font-size: 13px;
}

/* CHAT */

.chat {
    flex: 1;
    overflow-y: auto;
    padding: 40px 20px 150px;
}

.welcome {
    max-width: 750px;
    margin: 80px auto;
    text-align: center;
}

.ai-icon {
    width: 70px;
    height: 70px;
    margin: auto;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 20px;
    background: linear-gradient(135deg, #7c3aed, #a855f7);
    font-size: 32px;
    box-shadow: 0 0 35px rgba(139,92,246,.25);
}

.welcome h1 {
    margin-top: 25px;
    font-size: 42px;
}

.welcome h1 span {
    color: var(--purple);
}

.welcome p {
    margin-top: 12px;
    color: var(--muted);
}

/* SUGGESTIONS */

.suggestions {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    max-width: 700px;
    margin: 35px auto;
}

.suggestion {
    background: var(--panel);
    border: 1px solid var(--border);
    padding: 16px;
    border-radius: 12px;
    text-align: left;
    color: #ddd7e4;
    cursor: pointer;
}

.suggestion:hover {
    border-color: var(--purple);
}

/* MESSAGES */

.message {
    max-width: 800px;
    margin: 20px auto;
    padding: 18px;
    border-radius: 14px;
    line-height: 1.6;
}
