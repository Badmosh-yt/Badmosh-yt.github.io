<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Badmosh AI</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root {
    --bg: #07050d;
    --panel: #110c1b;
    --panel2: #171020;
    --border: #2b203d;
    --purple: #9b5cff;
    --purple2: #7c3aed;
    --text: #f5f3f7;
    --muted: #aaa2b5;
    --green: #4ade80;
    --red: #f87171;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html {
    scroll-behavior: smooth;
}

body {
    font-family: Arial, sans-serif;
    background:
        radial-gradient(circle at top, #211039 0%, #07050d 55%);
    color: var(--text);
    min-height: 100vh;
}

/* NAVBAR */

nav {
    position: sticky;
    top: 0;
    z-index: 1000;

    display: flex;
    justify-content: space-between;
    align-items: center;

    padding: 16px 7%;

    background: rgba(7,5,13,.92);
    backdrop-filter: blur(12px);

    border-bottom: 1px solid var(--border);
}

.logo {
    font-size: 23px;
    font-weight: 900;
}

.logo span {
    color: var(--purple);
}

.nav-right {
    display: flex;
    align-items: center;
    gap: 18px;
}

nav a {
    color: var(--text);
    text-decoration: none;
    font-size: 14px;
}

nav a:hover {
    color: var(--purple);
}

/* AUTH BUTTON */

.account-button {
    border: 1px solid var(--border);
    background: var(--panel2);
    color: white;
    padding: 9px 13px;
    border-radius: 9px;
    cursor: pointer;
}

.account-button:hover {
    border-color: var(--purple);
}

/* HERO */

.hero {
    min-height: 360px;

    display: flex;
    align-items: center;
    justify-content: center;

    text-align: center;

    padding: 70px 20px;
}

.hero-content {
    max-width: 800px;
}

.badge {
    display: inline-block;

    padding: 8px 14px;

    border: 1px solid var(--border);
    background: rgba(17,12,27,.8);

    border-radius: 50px;

    color: var(--purple);

    font-size: 13px;

    margin-bottom: 20px;
}

.hero h1 {
    font-size: clamp(50px, 9vw, 90px);
    font-weight: 900;
    letter-spacing: -3px;
}

.hero h1 span {
    color: var(--purple);
}

.hero p {
    max-width: 650px;
    margin: 18px auto;

    color: var(--muted);

    font-size: 18px;
    line-height: 1.6;
}

/* MAIN */

main {
    max-width: 950px;
    margin: auto;
    padding: 30px 20px 80px;
}

/* AUTH CARD */

.auth-card {
    max-width: 450px;
    margin: 0 auto 30px;

    background: var(--panel);

    border: 1px solid var(--border);

    border-radius: 18px;

    padding: 25px;
}

.auth-card h2 {
    margin-bottom: 8px;
}

.auth-card p {
    color: var(--muted);
    margin-bottom: 20px;
}

.auth-input {
    width: 100%;

    padding: 13px;

    margin-bottom: 10px;

    border-radius: 9px;

    border: 1px solid var(--border);

    background: #0b0810;

    color: white;

    outline: none;
}

.auth-input:focus {
    border-color: var(--purple);
}

.auth-button {
    width: 100%;

    padding: 13px;

    border: none;

    border-radius: 9px;

    background: var(--purple2);

    color: white;

    font-weight: bold;

    cursor: pointer;

    margin-top: 5px;
}

.auth-button:hover {
    background: var(--purple);
}

.google-button {
    background: white;
    color: #222;
    margin-top: 10px;
}

.google-button:hover {
    background: #eeeeee;
}

.auth-links {
    display: flex;
    gap: 10px;
    margin-top: 12px;
}

.auth-links button {
    flex: 1;

    background: transparent;

    border: 1px solid var(--border);

    color: var(--muted);

    padding: 10px;

    border-radius: 8px;

    cursor: pointer;
}

.auth-links button:hover {
    color: white;
    border-color: var(--purple);
}

.auth-message {
    margin-top: 15px;

    font-size: 13px;

    line-height: 1.5;
}

.success {
    color: var(--green);
}

.error {
    color: var(--red);
}

/* USER PANEL */

.user-panel {
    display: none;

    max-width: 850px;

    margin: 0 auto 20px;

    padding: 15px 18px;

    background: var(--panel);

    border: 1px solid var(--border);

    border-radius: 12px;

    align-items: center;

    justify-content: space-between;

    gap: 15px;
}

.user-panel.show {
    display: flex;
}

.user-info {
    color: var(--muted);
    font-size: 14px;
}

.user-info strong {
    color: white;
}

.logout-button {
    border: 1px solid var(--border);

    background: transparent;

    color: white;

    padding: 8px 12px;

    border-radius: 8px;

    cursor: pointer;
}

.logout-button:hover {
    border-color: var(--red);
    color: var(--red);
}

/* AI CARD */

.ai-card {
    background: var(--panel);

    border: 1px solid var(--border);

    border-radius: 18px;

    overflow: hidden;
}

.ai-top {
    padding: 16px 18px;

    border-bottom: 1px solid var(--border);

    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 15px;
}

.ai-title {
    font-weight: bold;
}

.ai-online {
    color: var(--green);
    font-size: 13px;
}

.ai-top-right {
    display: flex;
    align-items: center;
    gap: 12px;
}

.clear-button {
    background: transparent;

    color: var(--muted);

    border: 1px solid var(--border);

    border-radius: 8px;

    padding: 7px 10px;

    cursor: pointer;

    font-size: 12px;
}

.clear-button:hover {
    color: white;
    border-color: var(--purple);
}

.ai-chat {
    height: 430px;

    overflow-y: auto;

    padding: 20px;
}

.ai-message {
    max-width: 80%;

    padding: 13px;

    border-radius: 12px;

    margin-bottom: 12px;

    line-height: 1.5;

    word-wrap: break-word;
}

.ai-bot {
    background: #0d0915;

    border: 1px solid var(--border);
}

.ai-user {
    background: var(--purple2);

    margin-left: auto;
}

.ai-input {
    display: flex;

    gap: 8px;

    padding: 12px;

    border-top: 1px solid var(--border);
}

.ai-input input {
    flex: 1;

    min-width: 0;

    background: #0b0810;

    color: white;

    border: 1px solid var(--border);

    border-radius: 10px;

    padding: 13px;

    outline: none;
}

.ai-input input:focus {
    border-color: var(--purple);
}

.ai-input button {
    width: 50px;

    border: none;

    border-radius: 10px;

    background: var(--purple2);

    color: white;

    cursor: pointer;

    font-size: 18px;
}

.ai-input button:hover {
    background: var(--purple);
}

.ai-input button:disabled {
    opacity: .5;
    cursor: not-allowed;
}

/* FOOTER */

footer {
    text-align: center;

    padding: 30px;

    color: var(--muted);

    border-top: 1px solid var(--border);
}

footer strong {
    color: var(--purple);
}

/* MOBILE */

@media(max-width:700px) {

    nav {
        padding: 14px 18px;
    }

    nav a {
        display: none;
    }

    .hero {
        min-height: 300px;
        padding: 50px 20px;
    }

    .hero h1 {
        letter-spacing: -1px;
    }

    main {
        padding-left: 12px;
        padding-right: 12px;
    }

    .user-panel {
        flex-direction: column;
        align-items: stretch;
    }

    .logout-button {
        width: 100%;
    }

    .ai-top {
        align-items: flex-start;
    }

    .ai-top-right {
        flex-direction: column;
        align-items: flex-end;
    }

    .ai-message {
        max-width: 90%;
    }
}
</style>
</head>

<body>

<!-- NAVBAR -->

<nav>

    <div class="logo">
        BADMOSH <span>AI</span>
    </div>

    <div class="nav-right">

        <a href="index.html">
            📚 Books
        </a>

        <a href="server.html">
            🎮 SMP
        </a>

        <button
            id="accountButton"
            class="account-button"
            onclick="scrollToAuth()"
        >
            Sign In
        </button>

    </div>

</nav>


<!-- HERO -->

<header class="hero">

    <div class="hero-content">

        <div class="badge">
            🤖 BADMOSH AI
        </div>

        <h1>
            BADMOSH <span>AI</span>
        </h1>

        <p>
            Your AI assistant for Minecraft, coding,
            technology and more.
        </p>

    </div>

</header>


<main>

<!-- =========================
     AUTH
========================= -->

<section id="authSection">

    <div class="auth-card">

        <h2>
            🔐 Account
        </h2>

        <p>
            Sign in to use your Badmosh AI account.
        </p>

        <input
            id="email"
            class="auth-input"
            type="email"
            placeholder="Email address"
            autocomplete="email"
        >

        <input
            id="password"
            class="auth-input"
            type="password"
            placeholder="Password"
            autocomplete="current-password"
        >

        <button
            class="auth-button"
            onclick="signIn()"
        >
            Sign In
        </button>

        <button
            class="auth-button"
            onclick="signUp()"
        >
            Create Account
        </button>

        <button
            class="auth-button google-button"
            onclick="signInWithGoogle()"
        >
            🔵 Continue with Google
        </button>

        <div class="auth-links">

            <button onclick="resetPassword()">
                Forgot Password?
            </button>

        </div>

        <div
            id="authMessage"
            class="auth-message"
        ></div>

    </div>

</section>


<!-- =========================
     USER PANEL
========================= -->

<div
    id="userPanel"
    class="user-panel"
>

    <div class="user-info">

        Signed in as:
        <strong id="userEmail">
            —
        </strong>

    </div>

    <button
        class="logout-button"
        onclick="signOut()"
    >
        Sign Out
    </button>

</div>


<!-- =========================
     AI
========================= -->

<section>

    <div class="ai-card">

        <div class="ai-top">

            <div class="ai-title">
                🤖 Badmosh AI
            </div>

            <div class="ai-top-right">

                <div class="ai-online">
                    ● Online
                </div>

                <button
                    class="clear-button"
                    onclick="clearChat()"
                >
                    🗑️ Clear Chat
                </button>

            </div>

        </div>


        <div
            id="aiChat"
            class="ai-chat"
        >
        </div>


        <div class="ai-input">

            <input
                id="aiQuestion"
                type="text"
                placeholder="Ask Badmosh AI..."
                autocomplete="off"
            >

            <button
                id="aiSend"
                onclick="sendAI()"
            >
                ➤
            </button>

        </div>

    </div>

</section>

</main>


<!-- FOOTER -->

<footer>

    <strong>BADMOSH AI</strong>

    <br><br>

    <a href="index.html" style="color:#aaa2b5;">
        📚 Badmosh Books
    </a>

    &nbsp; • &nbsp;

    <a href="server.html" style="color:#aaa2b5;">
        🎮 Badmosh SMP
    </a>

    <br><br>

    © 2026 Badmosh

</footer>


<script>

/* =========================================================
   SUPABASE CONFIG
========================================================= */

const SUPABASE_URL =
    "https://evrzjkylpontvngwoszb.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_wSigh2nJLbJRfmDZXTStdA_WETjMZnJ";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );


/* =========================================================
   BADMOSH AI WORKER
========================================================= */

const WORKER_URL =
    "https://badmosh-ai.cchandasaini.workers.dev/";


/* =========================================================
   CHAT STORAGE
========================================================= */

const CHAT_STORAGE_KEY =
    "badmosh_ai_chat_history";


/* =========================================================
   ELEMENTS
========================================================= */

const authMessage =
    document.getElementById("authMessage");

const userPanel =
    document.getElementById("userPanel");

const userEmail =
    document.getElementById("userEmail");

const accountButton =
    document.getElementById("accountButton");

const aiChat =
    document.getElementById("aiChat");

const aiQuestion =
    document.getElementById("aiQuestion");

const aiSend =
    document.getElementById("aiSend");


/* =========================================================
   MESSAGE
========================================================= */

function showAuthMessage(
    message,
    type = ""
) {

    authMessage.textContent =
        message;

    authMessage.className =
        "auth-message " + type;

}


/* =========================================================
   SIGN UP
========================================================= */

async function signUp() {

    const email =
        document.getElementById("email")
            .value.trim();

    const password =
        document.getElementById("password")
            .value;


    if (!email || !password) {

        showAuthMessage(
            "Enter your email and password.",
            "error"
        );

        return;

    }


    if (password.length < 6) {

        showAuthMessage(
            "Password must be at least 6 characters.",
            "error"
        );

        return;

    }


    showAuthMessage(
        "Creating your account..."
    );


    const {
        data,
        error
    } =
        await supabaseClient.auth.signUp({

            email: email,

            password: password,

            options: {

                emailRedirectTo:
                    window.location.origin +
                    window.location.pathname

            }

        });


    if (error) {

        console.error(error);

        showAuthMessage(
            error.message,
            "error"
        );

        return;

    }


    /*
       Supabase may require email confirmation.
    */

    if (
        data.user &&
        !data.session
    ) {

        showAuthMessage(
            "Account created! Check your email to verify your account.",
            "success"
        );

    } else {

        showAuthMessage(
            "Account created successfully!",
            "success"
        );

    }

}


/* =========================================================
   SIGN IN
========================================================= */

async function signIn() {

    const email =
        document.getElementById("email")
            .value.trim();

    const password =
        document.getElementById("password")
            .value;


    if (!email || !password) {

        showAuthMessage(
            "Enter your email and password.",
            "error"
        );

        return;

    }


    showAuthMessage(
        "Signing in..."
    );


    const {
        data,
        error
    } =
        await supabaseClient.auth.signInWithPassword({

            email: email,

            password: password

        });


    if (error) {

        console.error(error);

        showAuthMessage(
            error.message,
            "error"
        );

        return;

    }


    showAuthMessage(
        "Signed in successfully!",
        "success"
    );


    updateUserUI(
        data.session
            ? data.session.user
            : null
    );

}


/* =========================================================
   GOOGLE SIGN IN
========================================================= */

async function signInWithGoogle() {

    showAuthMessage(
        "Opening Google sign-in..."
    );


    const {
        data,
        error
    } =
        await supabaseClient.auth.signInWithOAuth({

            provider: "google",

            options: {

                redirectTo:
                    window.location.href

            }

        });


    if (error) {

        console.error(error);

        showAuthMessage(
            error.message,
            "error"
        );

    }

}


/* =========================================================
   PASSWORD RESET
========================================================= */

async function resetPassword() {

    const email =
        document.getElementById("email")
            .value.trim();


    if (!email) {

        showAuthMessage(
            "Enter your email address first.",
            "error"
        );

        return;

    }


    showAuthMessage(
        "Sending password reset email..."
    );


    const {
        error
    } =
        await supabaseClient.auth.resetPasswordForEmail(
            email,
            {
                redirectTo:
                    window.location.href
            }
        );


    if (error) {

        console.error(error);

        showAuthMessage(
            error.message,
            "error"
        );

        return;

    }


    showAuthMessage(
        "Password reset email sent. Check your inbox.",
        "success"
    );

}


/* =========================================================
   SIGN OUT
========================================================= */

async function signOut() {

    const {
        error
    } =
        await supabaseClient.auth.signOut();


    if (error) {

        console.error(error);

        showAuthMessage(
            error.message,
            "error"
        );

        return;

    }


    updateUserUI(null);


    showAuthMessage(
        "You have been signed out.",
        "success"
    );

}


/* =========================================================
   USER UI
========================================================= */

function updateUserUI(user) {

    if (user) {

        userPanel.classList.add(
            "show"
        );

        userEmail.textContent =
            user.email || "Google user";

        accountButton.textContent =
            "Account";

    } else {

        userPanel.classList.remove(
            "show"
        );

        userEmail.textContent =
            "—";

        accountButton.textContent =
            "Sign In";

    }

}


/* =========================================================
   AUTH STATE
========================================================= */

supabaseClient.auth.onAuthStateChange(
    function(event, session) {

        console.log(
            "Auth event:",
            event
        );


        updateUserUI(
            session
                ? session.user
                : null
        );

    }
);


/* =========================================================
   GET CURRENT SESSION
========================================================= */

async function checkSession() {

    const {
        data,
        error
    } =
        await supabaseClient.auth.getSession();


    if (error) {

        console.error(
            "Session error:",
            error
        );

        return;

    }


    updateUserUI(
        data.session
            ? data.session.user
            : null
    );

}


/* =========================================================
   SCROLL TO AUTH
========================================================= */

function scrollToAuth() {

    document
        .getElementById("authSection")
        .scrollIntoView({
            behavior: "smooth"
        });

}


/* =========================================================
   WELCOME MESSAGE
========================================================= */

function showWelcomeMessage() {

    aiChat.innerHTML = `

        <div class="ai-message ai-bot">

            <strong>Badmosh AI</strong>

            <br><br>

            Hey! 👋 I'm Badmosh AI.

            <br>

            Ask me anything about Minecraft,
            coding, technology or the Badmosh SMP.

        </div>

    `;

}


/* =========================================================
   SAVE CHAT
========================================================= */

function saveChat() {

    const messages = [];


    aiChat
        .querySelectorAll(".ai-message")
        .forEach(function(message) {

            messages.push({

                type:
                    message.classList.contains(
                        "ai-user"
                    )
                        ? "user"
                        : "bot",

                html:
                    message.innerHTML

            });

        });


    try {

        localStorage.setItem(
            CHAT_STORAGE_KEY,
            JSON.stringify(messages)
        );

    } catch (error) {

        console.error(
            "Could not save chat:",
            error
        );

    }

}


/* =========================================================
   LOAD CHAT
========================================================= */

function loadChat() {

    let saved = null;


    try {

        saved =
            JSON.parse(
                localStorage.getItem(
                    CHAT_STORAGE_KEY
                )
            );

    } catch (error) {

        saved = null;

    }


    if (
        !Array.isArray(saved) ||
        saved.length === 0
    ) {

        showWelcomeMessage();

        return;

    }


    aiChat.innerHTML =
        "";


    saved.forEach(function(message) {

        const div =
            document.createElement("div");


        div.className =
            "ai-message " +
            (
                message.type === "user"
                    ? "ai-user"
                    : "ai-bot"
            );


        div.innerHTML =
            message.html;


        aiChat.appendChild(
            div
        );

    });


    aiChat.scrollTop =
        aiChat.scrollHeight;

}


/* =========================================================
   CLEAR CHAT
========================================================= */

function clearChat() {

    const confirmed =
        confirm(
            "Clear your Badmosh AI chat history?"
        );


    if (!confirmed) {

        return;

    }


    localStorage.removeItem(
        CHAT_STORAGE_KEY
    );


    showWelcomeMessage();

}


/* =========================================================
   SEND AI
========================================================= */

async function sendAI() {

    const question =
        aiQuestion.value.trim();


    if (!question) {

        return;

    }


    /* USER MESSAGE */

    const userMessage =
        document.createElement("div");


    userMessage.className =
        "ai-message ai-user";


    userMessage.textContent =
        question;


    aiChat.appendChild(
        userMessage
    );


    aiQuestion.value =
        "";


    aiSend.disabled =
        true;


    saveChat();


    /* THINKING */

    const thinking =
        document.createElement("div");


    thinking.className =
        "ai-message ai-bot";


    thinking.innerHTML =
        "<strong>Badmosh AI</strong><br>" +
        "Thinking... 🤔";


    aiChat.appendChild(
        thinking
    );


    aiChat.scrollTop =
        aiChat.scrollHeight;


    try {

        const response =
            await fetch(
                WORKER_URL,
                {

                    method: "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body: JSON.stringify({

                        question:
                            question

                    })

                }
            );


        let data;


        try {

            data =
                await response.json();

        } catch (error) {

            throw new Error(
                "AI server returned an invalid response."
            );

        }


        console.log(
            "AI response:",
            data
        );


        if (!response.ok) {

            throw new Error(
                data.error ||
                "AI request failed."
            );

        }


        let answer =
            "";


        /* OpenAI-compatible format */

        if (
            data.choices &&
            data.choices[0] &&
            data.choices[0].message &&
            data.choices[0].message.content
        ) {

            answer =
                data.choices[0]
                    .message
                    .content;

        }


        /* Backup formats */

        if (
            !answer &&
            data.response
        ) {

            answer =
                data.response;

        }


        if (
            !answer &&
            data.answer
        ) {

            answer =
                data.answer;

        }


        if (
            !answer &&
            data.content
        ) {

            answer =
                data.content;

        }


        if (!answer) {

            throw new Error(
                "No AI answer was received."
            );

        }


        thinking.innerHTML =
            "<strong>Badmosh AI</strong><br>" +
            formatAIText(answer);


    } catch (error) {

        console.error(
            "Badmosh AI error:",
            error
        );


        thinking.innerHTML =
            "<strong>Badmosh AI</strong><br>" +
            "Sorry, I couldn't connect right now." +
            "<br><br><small>" +
            escapeHTML(
                error.message
            ) +
            "</small>";

    }


    saveChat();


    aiSend.disabled =
        false;


    aiQuestion.focus();


    aiChat.scrollTop =
        aiChat.scrollHeight;

}


/* =========================================================
   ENTER KEY
========================================================= */

aiQuestion.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter" &&
            !event.shiftKey
        ) {

            event.preventDefault();

            sendAI();

        }

    }
);


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(text) {

    const div =
        document.createElement("div");


    div.textContent =
        text == null
            ? ""
            : String(text);


    return div.innerHTML;

}


/* =========================================================
   FORMAT AI TEXT
========================================================= */

function formatAIText(text) {

    let safe =
        escapeHTML(text);


    safe =
        safe.replace(
            /\*\*(.*?)\*\*/g,
            "<strong>$1</strong>"
        );


    safe =
        safe.replace(
            /\n/g,
            "<br>"
        );


    return safe;

}


/* =========================================================
   START
========================================================= */

showWelcomeMessage();

loadChat();

checkSession();
