<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Badmosh AI</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --bg:#08080b;
    --sidebar:#101014;
    --panel:#15151b;
    --panel2:#1d1d25;
    --border:#2b2b35;
    --text:#f5f5f7;
    --muted:#9999a5;
    --purple:#9b5cff;
    --purple2:#7c3aed;
    --danger:#ef4444;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:var(--bg);
    color:var(--text);
    height:100vh;
    overflow:hidden;
}

/* LOGIN */

.login-screen{
    position:fixed;
    inset:0;
    z-index:9999;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
        radial-gradient(circle at center,#35135e 0%,#08080b 58%);
}

.login-card{
    width:min(430px,90%);
    padding:35px;
    border:1px solid var(--border);
    border-radius:22px;
    background:rgba(21,21,27,.96);
    text-align:center;
    box-shadow:0 25px 100px rgba(0,0,0,.55);
}

.login-logo{
    font-size:32px;
    font-weight:900;
    margin-bottom:12px;
}

.login-logo span{
    color:var(--purple);
}

.login-card p{
    color:var(--muted);
    line-height:1.6;
    margin-bottom:25px;
}

.google-btn{
    width:100%;
    border:0;
    border-radius:12px;
    padding:14px;
    background:white;
    color:#111;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
}

.google-btn:hover{
    opacity:.9;
}

.login-error{
    color:#f87171;
    font-size:13px;
    margin-top:15px;
}

/* APP */

.app{
    display:none;
    width:100%;
    height:100vh;
}

.app.show{
    display:flex;
}

/* SIDEBAR */

.sidebar{
    width:275px;
    height:100vh;
    flex-shrink:0;
    display:flex;
    flex-direction:column;
    padding:15px;
    background:var(--sidebar);
    border-right:1px solid var(--border);
}

.sidebar-logo{
    font-size:21px;
    font-weight:900;
    padding:10px;
    margin-bottom:10px;
}

.sidebar-logo span{
    color:var(--purple);
}

.new-chat{
    width:100%;
    padding:12px;
    border-radius:11px;
    border:1px solid var(--border);
    background:var(--panel2);
    color:white;
    cursor:pointer;
    text-align:left;
    font-weight:bold;
    margin-bottom:12px;
}

.new-chat:hover{
    border-color:var(--purple);
}

.menu{
    display:flex;
    flex-direction:column;
    gap:3px;
}

.menu button{
    width:100%;
    padding:10px;
    border:0;
    border-radius:9px;
    background:transparent;
    color:#ddd;
    cursor:pointer;
    text-align:left;
    font-size:14px;
}

.menu button:hover{
    background:var(--panel2);
    color:white;
}

.history-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:18px 8px 8px;
}

.history-header span{
    color:var(--muted);
    font-size:12px;
    font-weight:bold;
}

.clear-history{
    border:0;
    background:transparent;
    color:#888;
    cursor:pointer;
    font-size:11px;
}

.clear-history:hover{
    color:#f87171;
}

.history{
    flex:1;
    overflow-y:auto;
}

.history-item{
    display:flex;
    align-items:center;
    gap:5px;
    padding:9px;
    margin-bottom:3px;
    border-radius:8px;
    color:#ccc;
    cursor:pointer;
    font-size:13px;
}

.history-item:hover,
.history-item.active{
    background:var(--panel2);
}

.history-item.pinned{
    color:#d8b4fe;
}

.history-name{
    flex:1;
    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
}

.history-actions{
    display:flex;
    gap:2px;
}

.small-btn{
    border:0;
    background:transparent;
    color:#888;
    cursor:pointer;
    padding:3px;
}

.small-btn:hover{
    color:white;
}

.sidebar-bottom{
    border-top:1px solid var(--border);
    padding-top:12px;
}

.user-box{
    display:flex;
    align-items:center;
    gap:9px;
}

.avatar{
    width:36px;
    height:36px;
    border-radius:50%;
    background:var(--purple2);
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
    overflow:hidden;
}

.avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.user-info{
    flex:1;
    min-width:0;
}

.user-info strong,
.user-info small{
    display:block;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}

.user-info small{
    color:var(--muted);
    margin-top:3px;
}

.logout{
    border:0;
    background:transparent;
    color:#999;
    cursor:pointer;
    font-size:18px;
}

/* MAIN */

.main{
    flex:1;
    min-width:0;
    height:100vh;
    display:flex;
    flex-direction:column;
}

.topbar{
    height:60px;
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 20px;
    border-bottom:1px solid var(--border);
}

.top-left{
    display:flex;
    align-items:center;
    gap:12px;
}

.mobile-menu{
    display:none;
    border:0;
    background:transparent;
    color:white;
    font-size:22px;
    cursor:pointer;
}

.chat-title{
    font-weight:bold;
}

.plan{
    padding:7px 13px;
    border-radius:20px;
    background:#211433;
    border:1px solid #49306a;
    color:#d8b4fe;
    font-size:12px;
}

/* CHAT */

.chat{
    flex:1;
    overflow-y:auto;
    padding:30px 20px 150px;
}

.chat-inner{
    max-width:850px;
    margin:auto;
}

.welcome{
    text-align:center;
    margin:80px auto;
}

.welcome h1{
    font-size:clamp(36px,6vw,60px);
    margin-bottom:15px;
}

.welcome h1 span{
    color:var(--purple);
}

.welcome p{
    color:var(--muted);
}

/* MESSAGES */

.message{
    display:flex;
    margin:18px 0;
}

.message.user{
    justify-content:flex-end;
}

.message-content{
    max-width:80%;
    padding:13px 16px;
    border-radius:15px;
    line-height:1.6;
    white-space:pre-wrap;
    word-break:break-word;
}

.message.ai .message-content{
    background:var(--panel);
    border:1px solid var(--border);
}

.message.user .message-content{
    background:var(--purple2);
}

.attachment{
    margin-top:9px;
    padding:8px 10px;
    border:1px solid rgba(255,255,255,.15);
    border-radius:8px;
    font-size:12px;
}

/* INPUT */

.input-area{
    position:fixed;
    left:275px;
    right:0;
    bottom:0;
    padding:20px;
    background:linear-gradient(transparent,var(--bg) 30%);
}

.input-box{
    max-width:850px;
    margin:auto;
    padding:10px;
    border:1px solid var(--border);
    border-radius:18px;
    background:var(--panel);
}

.attach-row{
    display:flex;
    align-items:center;
    gap:6px;
    margin-bottom:7px;
}

.tool-btn{
    padding:7px 10px;
    border:1px solid var(--border);
    border-radius:8px;
    background:var(--panel2);
    color:white;
    cursor:pointer;
    font-size:12px;
}

.tool-btn:hover{
    border-color:var(--purple);
}

.file-name{
    color:#aaa;
    font-size:12px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}

.input-row{
    display:flex;
    gap:8px;
}

textarea{
    flex:1;
    min-height:45px;
    max-height:150px;
    resize:none;
    padding:12px;
    border:0;
    outline:0;
    background:transparent;
    color:white;
    font-family:inherit;
    font-size:15px;
}

.send{
    width:48px;
    border:0;
    border-radius:11px;
    background:var(--purple2);
    color:white;
    cursor:pointer;
    font-size:18px;
}

.send:hover{
    background:var(--purple);
}

.send:disabled{
    opacity:.5;
    cursor:not-allowed;
}

/* MODAL */

.modal{
    position:fixed;
    inset:0;
    z-index:5000;
    display:none;
    align-items:center;
    justify-content:center;
    background:rgba(0,0,0,.72);
}

.modal.show{
    display:flex;
}

.modal-card{
    width:min(520px,90%);
    padding:25px;
    border:1px solid var(--border);
    border-radius:18px;
    background:var(--panel);
}

.modal-card h2{
    margin-bottom:14px;
}

.modal-card p{
    color:var(--muted);
    line-height:1.6;
    white-space:pre-wrap;
}

.modal-buttons{
    display:flex;
    gap:10px;
    margin-top:20px;
}

.modal-buttons button{
    flex:1;
    padding:11px;
    border:1px solid var(--border);
    border-radius:9px;
    background:var(--panel2);
    color:white;
    cursor:pointer;
}

/* MOBILE */

@media(max-width:800px){

    .sidebar{
        position:fixed;
        left:-285px;
        top:0;
        bottom:0;
        z-index:3000;
        transition:left .25s ease;
    }

    .sidebar.open{
        left:0;
    }

    .mobile-menu{
        display:block;
    }

    .input-area{
        left:0;
    }

    .message-content{
        max-width:90%;
    }
}
</style>
</head>

<body>

<!-- LOGIN -->

    <div class="login-card">

        <button class="google-btn" id="googleLogin">

        </button>

            </button>

<script>
/* =========================================================
   CONFIGURATION
========================================================= */

const SUPABASE_URL =
    "https://evrzjkylpontvngwoszb.supabase.co";

const SUPABASE_ANON_KEY =
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFub24iLCJpYXQiOjE3ODk5MTIzMzcsImV4cCI6MjEwNTQ4ODMzN30.euAL0ZTtUcPQ2RFreur9vj5kSvZUoFE076QN93qRoc0";

const WORKER_URL =
    "https://badmosh-ai.cchandasaini.workers.dev/";


/* =========================================================
   SUPABASE CLIENT
========================================================= */

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );


/* =========================================================
   STATE
========================================================= */

let currentUser = null;
let chats = [];
let currentChatId = null;
let selectedFile = null;


/* =========================================================
   ELEMENTS
========================================================= */

const loginScreen =
    document.getElementById("loginScreen");

const app =
    document.getElementById("app");

const loginError =
    document.getElementById("loginError");

const historyElement =
    document.getElementById("history");

const chatInner =
    document.getElementById("chatInner");

const chatElement =
    document.getElementById("chat");

const question =
    document.getElementById("question");

const sendButton =
    document.getElementById("sendButton");

const fileInput =
    document.getElementById("fileInput");

const imageInput =
    document.getElementById("imageInput");

const fileName =
    document.getElementById("fileName");


/* =========================================================
   GOOGLE LOGIN
========================================================= */

async function googleLogin(){

    loginError.textContent = "";

    const redirectUrl =
        window.location.origin +
        window.location.pathname;


    const { error } =
        await supabaseClient.auth.signInWithOAuth({

            provider:"google",

            options:{
                redirectTo:redirectUrl
            }

        });


    if(error){

        console.error(error);

        loginError.textContent =
            error.message;

    }

}


/* =========================================================
   AUTH
========================================================= */

async function checkAuth(){

    const {
        data,
        error
    } =
        await supabaseClient.auth.getSession();


    if(error){

        console.error(error);

        showLogin();

        return;

    }


    if(data.session){

        currentUser =
            data.session.user;

        showApp();

    }else{

        showLogin();

    }

}


supabaseClient.auth.onAuthStateChange(
    function(event,session){

        if(session){

            currentUser =
                session.user;

            showApp();

        }else{

            currentUser = null;

            showLogin();

        }

    }
);


/* =========================================================
   SHOW LOGIN
========================================================= */

function showLogin(){

    loginScreen.style.display =
        "flex";

    app.classList.remove(
        "show"
    );

}


/* =========================================================
   SHOW APP
========================================================= */

function showApp(){

    loginScreen.style.display =
        "none";

    app.classList.add(
        "show"
    );


    const metadata =
        currentUser.user_metadata || {};


    const name =
        metadata.full_name ||
        metadata.name ||
        "User";


    const email =
        currentUser.email ||
        "";


    document.getElementById("userName")
        .textContent = name;


    document.getElementById("userEmail")
        .textContent = email;


    const avatar =
        document.getElementById("avatar");


    if(metadata.avatar_url){

        avatar.innerHTML =
            `<img src="${escapeAttribute(metadata.avatar_url)}" alt="">`;

    }else{

        avatar.textContent =
            name.charAt(0).toUpperCase();

    }


    loadChats();

}


/* =========================================================
   LOGOUT
========================================================= */

async function logout(){

    await supabaseClient.auth.signOut();

}


/* =========================================================
   LOCAL STORAGE KEY
========================================================= */

function storageKey(){

    if(!currentUser){
        return null;
    }

    return "badmosh_ai_chats_" +
        currentUser.id;

}


/* =========================================================
   LOAD CHATS
========================================================= */

function loadChats(){

    try{

        const saved =
            localStorage.getItem(
                storageKey()
            );


        chats =
            saved
                ? JSON.parse(saved)
                : [];


        if(!Array.isArray(chats)){
            chats = [];
        }

    }catch(error){

        console.error(error);

        chats = [];

    }


    renderHistory();

}


/* =========================================================
   SAVE CHATS
========================================================= */

function saveChats(){

    if(!currentUser){
        return;
    }


    localStorage.setItem(
        storageKey(),
        JSON.stringify(chats)
    );

}


/* =========================================================
   NEW CHAT
========================================================= */

function newChat(){

    currentChatId = null;


    document.getElementById("chatTitle")
        .textContent =
        "New chat";


    chatInner.innerHTML = `

        <div class="welcome">

            <h1>
                Hello, <span>Badmosh!</span>
            </h1>

            <p>
                What can I help you with today?
            </p>

        </div>

    `;


    question.value = "";

    selectedFile = null;

    fileName.textContent = "";


    renderHistory();

    question.focus();

    closeSidebar();

}


/* =========================================================
   ENSURE CHAT
========================================================= */

function ensureChat(){

    if(currentChatId){
        return;
    }


    const newChatObject = {

        id:
            Date.now().toString() +
            Math.random()
                .toString(16)
                .slice(2),

        title:
            "New chat",

        pinned:
            false,

        messages:
            []

    };


    chats.unshift(
        newChatObject
    );


    currentChatId =
        newChatObject.id;


    saveChats();

    renderHistory();

}


/* =========================================================
   RENDER HISTORY
========================================================= */

function renderHistory(){

    historyElement.innerHTML = "";


    chats.forEach(function(chat){

        const item =
            document.createElement("div");


        item.className =
            "history-item" +
            (chat.pinned ? " pinned" : "") +
            (chat.id === currentChatId ? " active" : "");


        const name =
            document.createElement("div");


        name.className =
            "history-name";


        name.textContent =
            chat.title ||
            "New chat";


        const actions =
            document.createElement("div");


        actions.className =
            "history-actions";


        const pin =
            document.createElement("button");


        pin.className =
            "small-btn";


        pin.title =
            chat.pinned
                ? "Unpin"
                : "Pin";


        pin.textContent =
            chat.pinned
                ? "📌"
                : "📍";


        pin.onclick =
            function(event){

                event.stopPropagation();

                togglePin(chat.id);

            };


        const deleteButton =
            document.createElement("button");


        deleteButton.className =
            "small-btn";


        deleteButton.title =
            "Delete";


        deleteButton.textContent =
            "🗑️";


        deleteButton.onclick =
            function(event){

                event.stopPropagation();

                deleteChat(chat.id);

            };


        actions.appendChild(pin);

        actions.appendChild(
            deleteButton
        );


        item.appendChild(name);

        item.appendChild(actions);


        item.onclick =
            function(){

                openChat(chat.id);

            };


        historyElement.appendChild(item);

    });

}


/* =========================================================
   OPEN CHAT
========================================================= */

function openChat(id){

    const chat =
        chats.find(
            function(c){
                return c.id === id;
            }
        );


    if(!chat){
        return;
    }


    currentChatId =
        id;


    document.getElementById("chatTitle")
        .textContent =
        chat.title ||
        "New chat";


    chatInner.innerHTML = "";


    chat.messages.forEach(
        function(message){

            addMessageToScreen(
                message.role,
                message.content,
                message.attachment || null
            );

        }
    );


    renderHistory();


    chatElement.scrollTop =
        chatElement.scrollHeight;


    closeSidebar();

}


/* =========================================================
   DELETE ONE CHAT
========================================================= */

function deleteChat(id){

    const confirmed =
        confirm(
            "Delete this chat?"
        );


    if(!confirmed){
        return;
    }


    chats =
        chats.filter(
            function(chat){
                return chat.id !== id;
            }
        );


    saveChats();


    if(currentChatId === id){

        currentChatId = null;

        newChat();

    }


    renderHistory();

}


/* =========================================================
   PIN
========================================================= */

function togglePin(id){

    const chat =
        chats.find(
            function(c){
                return c.id === id;
            }
        );


    if(!chat){
        return;
    }


    chat.pinned =
        !chat.pinned;


    chats.sort(
        function(a,b){

            if(a.pinned === b.pinned){
                return 0;
            }

            return a.pinned ? -1 : 1;

        }
    );


    saveChats();

    renderHistory();

}


/* =========================================================
   CLEAR ALL
========================================================= */

function clearAllHistory(){

    if(chats.length === 0){

        alert(
            "There is no chat history."
        );

        return;

    }


    const confirmed =
        confirm(
            "Delete ALL Badmosh AI chat history?"
        );


    if(!confirmed){
        return;
    }


    chats = [];

    saveChats();

    currentChatId = null;

    newChat();

}


/* =========================================================
   SEND MESSAGE
========================================================= */

async function sendMessage(){

    const text =
        question.value.trim();


    if(!text && !selectedFile){
        return;
    }


    ensureChat();


    const chat =
        chats.find(
            function(c){
                return c.id === currentChatId;
            }
        );


    if(!chat){
        return;
    }


    let displayText =
        text ||
        "Please analyze this file.";


    let attachment = null;


    if(selectedFile){

        attachment = {

            name:
                selectedFile.name,

            type:
                selectedFile.type,

            size:
                selectedFile.size

        };

    }


    if(chat.messages.length === 0){

        chat.title =
            displayText
                .replace(/\s+/g," ")
                .substring(0,40);


        document.getElementById("chatTitle")
            .textContent =
            chat.title;

    }


    chat.messages.push({

        role:"user",

        content:displayText,

        attachment:attachment

    });


    addMessageToScreen(
        "user",
        displayText,
        attachment
    );


    question.value = "";

    sendButton.disabled = true;


    const fileForRequest =
        selectedFile;


    selectedFile = null;

    fileName.textContent = "";


    const thinking =
        addMessageToScreen(
            "ai",
            "Thinking... 🤔"
        );


    chatElement.scrollTop =
        chatElement.scrollHeight;


    try{

        const payload = {

            question:
                displayText

        };


        /*
         * The Worker currently receives the question.
         * File/image upload is displayed locally unless
         * your Worker is separately configured to accept files.
         */


        const response =
            await fetch(
                WORKER_URL,
                {

                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify(
                            payload
                        )

                }
            );


        let data = null;


        try{

            data =
                await response.json();

        }catch{

            data = {};

        }


        if(!response.ok){

            throw new Error(
                data.error ||
                "AI request failed. HTTP " +
                response.status
            );

        }


        let answer = "";


        if(
            data.choices &&
            data.choices[0] &&
            data.choices[0].message
        ){

            answer =
                data.choices[0]
                    .message
                    .content ||
                "";

        }


        if(!answer && data.response){
            answer = data.response;
        }


        if(!answer && data.answer){
            answer = data.answer;
        }


        if(!answer && data.content){
            answer = data.content;
        }


        if(!answer && typeof data === "string"){
            answer = data;
        }


        if(!answer){

            throw new Error(
                "The Worker returned no AI answer."
            );

        }


        thinking.textContent =
            answer;


        chat.messages.push({

            role:"ai",

            content:answer

        });


    }catch(error){

        console.error(
            "Badmosh AI error:",
            error
        );


        thinking.textContent =
            "Sorry, I couldn't connect to Badmosh AI.\n\n" +
            error.message;

    }


    saveChats();

    renderHistory();

    sendButton.disabled = false;

    question.focus();

    chatElement.scrollTop =
        chatElement.scrollHeight;

}


/* =========================================================
   ADD MESSAGE
========================================================= */

function addMessageToScreen(
    role,
    text,
    attachment
){

    const wrapper =
        document.createElement("div");


    wrapper.className =
        "message " +
        role;


    const content =
        document.createElement("div");


    content.className =
        "message-content";


    content.textContent =
        text;


    if(attachment){

        const file =
            document.createElement("div");


        file.className =
            "attachment";


        file.textContent =
            "📎 " +
            attachment.name;


        content.appendChild(file);

    }


    wrapper.appendChild(
        content
    );


    chatInner.appendChild(
        wrapper
    );


    chatElement.scrollTop =
        chatElement.scrollHeight;


    return content;

}

function escapeAttribute(value){
