<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Badmosh AI</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
    --bg:#08060d;
    --sidebar:#0d0914;
    --panel:#12101a;
    --panel2:#181421;
    --border:#292333;
    --purple:#9b5cff;
    --purple2:#7c3aed;
    --text:#f5f3f7;
    --muted:#a9a2b3;
    --green:#4ade80;
    --red:#f87171;
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    height:100%;
}

body{
    font-family:Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    overflow:hidden;
}

/* AUTH */

.auth{
    position:fixed;
    inset:0;
    z-index:9999;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    background:
        radial-gradient(circle at top,#30134b,#08060d 65%);
}

.auth.hidden{
    display:none;
}

.auth-card{
    width:100%;
    max-width:420px;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:22px;
    padding:30px;
    box-shadow:0 20px 80px #0009;
}

.auth-logo{
    text-align:center;
    font-size:32px;
    font-weight:900;
    margin-bottom:8px;
}

.auth-logo span{
    color:var(--purple);
}

.auth-sub{
    text-align:center;
    color:var(--muted);
    margin-bottom:25px;
}

.auth-input{
    width:100%;
    padding:13px;
    margin-bottom:10px;
    background:#0a0710;
    border:1px solid var(--border);
    border-radius:9px;
    color:white;
    outline:none;
}

.auth-input:focus{
    border-color:var(--purple);
}

.auth-btn{
    width:100%;
    padding:13px;
    margin-top:7px;
    border:none;
    border-radius:9px;
    background:var(--purple2);
    color:white;
    font-weight:bold;
    cursor:pointer;
}

.auth-btn:hover{
    background:var(--purple);
}

.google-btn{
    background:white;
    color:#222;
}

.google-btn:hover{
    background:#eee;
}

.auth-msg{
    min-height:20px;
    margin-top:14px;
    text-align:center;
    font-size:13px;
}

.error{
    color:var(--red);
}

.success{
    color:var(--green);
}

/* APP */

.app{
    display:flex;
    height:100vh;
}

/* SIDEBAR */

.sidebar{
    width:280px;
    flex-shrink:0;
    background:var(--sidebar);
    border-right:1px solid var(--border);
    padding:15px;
    display:flex;
    flex-direction:column;
    transition:.25s;
}

.brand{
    font-size:20px;
    font-weight:900;
    padding:10px;
    margin-bottom:10px;
}

.brand span{
    color:var(--purple);
}

.new-chat{
    width:100%;
    padding:13px;
    border-radius:10px;
    border:1px solid var(--border);
    background:var(--panel2);
    color:white;
    font-weight:bold;
    cursor:pointer;
    text-align:left;
    margin-bottom:12px;
}

.new-chat:hover{
    border-color:var(--purple);
}

/* MENU */

.menu{
    display:flex;
    flex-direction:column;
    gap:3px;
}

.menu-btn{
    width:100%;
    padding:10px;
    border:none;
    background:transparent;
    color:var(--text);
    border-radius:9px;
    text-align:left;
    cursor:pointer;
}

.menu-btn:hover,
.menu-btn.active{
    background:#21172e;
    color:#d4b5ff;
}

/* HISTORY */

.history-label{
    color:var(--muted);
    font-size:11px;
    text-transform:uppercase;
    margin:18px 10px 7px;
}

.history{
    overflow-y:auto;
    flex:1;
}

.chat-item{
    display:flex;
    align-items:center;
    gap:3px;
    margin-bottom:3px;
}

.chat-open{
    flex:1;
    min-width:0;
    padding:9px;
    border:none;
    background:transparent;
    color:#ddd7e5;
    text-align:left;
    border-radius:8px;
    cursor:pointer;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.chat-open:hover{
    background:var(--panel2);
}

.chat-action{
    border:none;
    background:transparent;
    color:var(--muted);
    cursor:pointer;
    padding:5px;
}

.chat-action:hover{
    color:white;
}

.empty-history{
    color:#686171;
    font-size:12px;
    padding:10px;
}

/* PLAN */

.plan-box{
    margin-top:10px;
    padding:12px;
    border:1px solid var(--border);
    background:var(--panel);
    border-radius:12px;
}

.plan-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.plan-name{
    font-weight:bold;
}

.plan-badge{
    font-size:11px;
    padding:4px 7px;
    border-radius:20px;
    background:#28173d;
    color:#caa8ff;
}

.upgrade{
    width:100%;
    margin-top:9px;
    padding:8px;
    border:none;
    border-radius:8px;
    background:var(--purple2);
    color:white;
    cursor:pointer;
}

/* ACCOUNT */

.account{
    border-top:1px solid var(--border);
    margin-top:10px;
    padding-top:10px;
}

.account-email{
    color:var(--muted);
    font-size:12px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    margin-bottom:8px;
}

.logout{
    width:100%;
    padding:8px;
    background:transparent;
    border:1px solid var(--border);
    border-radius:8px;
    color:var(--muted);
    cursor:pointer;
}

.logout:hover{
    border-color:var(--red);
    color:var(--red);
}

/* MAIN */

.main{
    flex:1;
    min-width:0;
    display:flex;
    flex-direction:column;
    position:relative;
}

.topbar{
    height:60px;
    flex-shrink:0;
    border-bottom:1px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 20px;
}

.mobile-menu{
    display:none;
    background:transparent;
    border:none;
    color:white;
    font-size:22px;
    cursor:pointer;
}

.top-title{
    font-weight:bold;
}

.online{
    color:var(--green);
    font-size:12px;
}

/* CHAT */

.chat{
    flex:1;
    overflow-y:auto;
    padding:30px 20px 150px;
}

.chat-inner{
    max-width:850px;
    margin:auto;
}

.welcome{
    text-align:center;
    padding:90px 20px 40px;
}

.welcome-icon{
    font-size:55px;
}

.welcome h1{
    margin-top:12px;
    font-size:42px;
}

.welcome h1 span{
    color:var(--purple);
}

.welcome p{
    color:var(--muted);
    margin-top:12px;
}

.message{
    display:flex;
    margin-bottom:20px;
}

.message.user{
    justify-content:flex-end;
}

.message-content{
    max-width:80%;
    padding:14px 16px;
    border-radius:14px;
    line-height:1.6;
    word-break:break-word;
}

.message.bot .message-content{
    background:var(--panel);
    border:1px solid var(--border);
}

.message.user .message-content{
    background:var(--purple2);
}

/* COMPOSER */

.composer-area{
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    padding:15px 20px 20px;
    background:linear-gradient(
        transparent,
        var(--bg) 30%
    );
}

.composer{
    max-width:850px;
    margin:auto;
    padding:10px;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:17px;
}

.attachments{
    display:flex;
    gap:7px;
    margin-bottom:7px;
    flex-wrap:wrap;
}

.attach{
    padding:7px 10px;
    background:var(--panel2);
    border:1px solid var(--border);
    border-radius:8px;
    color:var(--muted);
    cursor:pointer;
    font-size:12px;
}

.attach:hover{
    color:white;
    border-color:var(--purple);
}

.file-input{
    display:none;
}

.input-row{
    display:flex;
    gap:8px;
}

.question{
    flex:1;
    min-width:0;
    padding:12px;
    background:transparent;
    border:none;
    outline:none;
    color:white;
}

.send{
    width:45px;
    height:45px;
    border:none;
    border-radius:11px;
    background:var(--purple2);
    color:white;
    cursor:pointer;
    font-size:17px;
}

.send:hover{
    background:var(--purple);
}

.send:disabled{
    opacity:.5;
}

/* MODAL */

.modal{
    position:fixed;
    inset:0;
    background:#000a;
    display:none;
    align-items:center;
    justify-content:center;
    z-index:5000;
    padding:20px;
}

.modal.show{
    display:flex;
}

.modal-card{
    width:100%;
    max-width:600px;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:18px;
    padding:25px;
}

.modal-card h2{
    margin-bottom:8px;
}

.modal-card p{
    color:var(--muted);
    line-height:1.6;
}

.close{
    width:100%;
    margin-top:20px;
    padding:11px;
    background:transparent;
    border:1px solid var(--border);
    border-radius:9px;
    color:white;
    cursor:pointer;
}

/* PLANS */

.plans{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
    margin-top:20px;
}

.plan{
    border:1px solid var(--border);
    background:var(--panel2);
    border-radius:12px;
    padding:16px;
}

.plan h3{
    margin-bottom:5px;
}

.plan-price{
    color:#cba9ff;
    font-size:22px;
    font-weight:bold;
}

.plan ul{
    list-style:none;
    margin-top:12px;
}

.plan li{
    color:var(--muted);
    padding:4px 0;
    font-size:13px;
}

/* MOBILE */

@media(max-width:800px){

    .sidebar{
        position:fixed;
        left:-290px;
        top:0;
        bottom:0;
        z-index:3000;
    }

    .sidebar.open{
        left:0;
    }

    .mobile-menu{
        display:block;
    }

    .message-content{
        max-width:90%;
    }

    .welcome{
        padding-top:60px;
    }

    .welcome h1{
        font-size:30px;
    }

    .plans{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<body>

<!-- AUTH -->

<div id="authScreen" class="auth">

    <div class="auth-card">

        <div class="auth-logo">
            BADMOSH <span>AI</span>
        </div>

        <div class="auth-sub">
            Your AI workspace
        </div>

        <input
            id="email"
            class="auth-input"
            type="email"
            placeholder="Email address"
        >

        <input
            id="password"
            class="auth-input"
            type="password"
            placeholder="Password"
        >

        <button
            class="auth-btn"
            onclick="signIn()">
            Sign In
        </button>

        <button
            class="auth-btn"
            onclick="signUp()">
            Create Account
        </button>

        <button
            class="auth-btn google-btn"
            onclick="googleSignIn()">
            🔵 Continue with Google
        </button>

        <div id="authMessage" class="auth-msg"></div>

    </div>

</div>


<!-- APP -->

<div class="app">

    <!-- SIDEBAR -->

    <aside id="sidebar" class="sidebar">

        <div class="brand">
            🤖 BADMOSH <span>AI</span>
        </div>

        <button
            class="new-chat"
            onclick="newChat()">
            ✏️ New chat
        </button>


        <div class="menu">

            <button
                class="menu-btn active"
                onclick="feature('Images')">
                🖼️ Images
            </button>

            <button
                class="menu-btn"
                onclick="feature('Library')">
                📚 Library
            </button>

            <button
                class="menu-btn"
                onclick="feature('Scheduled')">
                ⏰ Scheduled
            </button>

            <button
                class="menu-btn"
                onclick="feature('Plugins')">
                🔌 Plugins
            </button>

            <button
                class="menu-btn"
                onclick="feature('Projects')">
                📁 Projects
            </button>

            <button
                class="menu-btn"
                onclick="feature('Codex')">
                💻 Codex
            </button>

            <button
                class="menu-btn"
                onclick="feature('More')">
                ••• More
            </button>

        </div>


        <div class="history-label">
            📌 Pinned
        </div>

        <div
            id="pinnedHistory"
            class="history">
        </div>


        <div class="history-label">
            🕘 History
        </div>

        <div
            id="history"
            class="history">
        </div>


        <!-- PLAN -->

        <div class="plan-box">

            <div class="plan-row">

                <span class="plan-name">
                    Free
                </span>

                <span class="plan-badge">
                    CURRENT
                </span>

            </div>

            <button
                class="upgrade"
                onclick="showPlans()">
                View plans
            </button>

        </div>


        <!-- ACCOUNT -->

        <div class="account">

            <div
                id="accountEmail"
                class="account-email">
                Not signed in
            </div>

            <button
                class="logout"
                onclick="signOut()">
                Sign Out
            </button>

        </div>

    </aside>


    <!-- MAIN -->

    <main class="main">

        <header class="topbar">

            <button
                class="mobile-menu"
                onclick="toggleSidebar()">
                ☰
            </button>

            <div
                id="topTitle"
                class="top-title">
                Badmosh AI
            </div>

            <div class="online">
                ● Online
            </div>

        </header>


        <div
            id="chat"
            class="chat">

            <div class="chat-inner">

                <div
                    id="welcome"
                    class="welcome">

                    <div class="welcome-icon">
                        🤖
                    </div>

                    <h1>
                        Welcome to BADMOSH
                        <span>AI</span>
                    </h1>

                    <p>
                        Ask questions, write code,
                        learn and create.
                    </p>

                <div id="messages"></div>

            </div>

        <div class="composer-area">

            <div class="composer">

                            onchange="filesSelected()">

                    </label>


                    <label class="attach">

                        🖼️ Image

                        <input
                            id="imageInput"
                            class="file-input"
                            type="file"
                            accept="image/*"
                            multiple
                            onchange="imagesSelected()">

                    </label>


                    <button
                        class="attach"
                        onclick="feature('Image generation')">
                        🎨 Create image
                    </button>

                </div>


                <div class="input-row">

                    <input
                        id="question"
                        class="question"
                        type="text"
                        placeholder="Message Badmosh AI..."
                        autocomplete="off">

                    <button
                        id="send"
                        class="send"
                        onclick="sendMessage()">
                        ➤
                    </button>

                </div>

            </div>

        </div>

    </main>

</div>


<!-- MODAL -->

<div
    id="modal"
    class="modal">

    <div class="modal-card">

        <h2 id="modalTitle">
            Badmosh AI
        </h2>

        <div id="modalContent"></div>

        <button
            class="close"
            onclick="closeModal()">
            Close
        </button>

    </div>

</div>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
    "https://evrzjkylpontvngwoszb.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_wSigh2nJLbJRfmDZXTStdA_WETjMZnJ";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );


/* =====================================================
   AI WORKER
===================================================== */

const WORKER_URL =
    "https://badmosh-ai.cchandasaini.workers.dev/";


/* =====================================================
   STATE
===================================================== */

let currentUser = null;
let currentChatId = null;
let chats = [];


/* =====================================================
   ELEMENTS
===================================================== */

const authScreen =
    document.getElementById("authScreen");

const authMessage =
    document.getElementById("authMessage");

const question =
    document.getElementById("question");

const messages =
    document.getElementById("messages");

const welcome =
    document.getElementById("welcome");

const history =
    document.getElementById("history");

const pinnedHistory =
    document.getElementById("pinnedHistory");

const accountEmail =
    document.getElementById("accountEmail");

const sendButton =
    document.getElementById("send");


/* =====================================================
   AUTH MESSAGE
===================================================== */

function authMsg(text,type=""){

    authMessage.textContent = text;

    authMessage.className =
        "auth-msg " + type;
}


/* =====================================================
   SIGN UP
===================================================== */

async function signUp(){

    const email =
        document.getElementById("email")
        .value
        .trim();

    const password =
        document.getElementById("password")
        .value;

    if(!email || !password){

        authMsg(
            "Enter your email and password.",
            "error"
        );

        return;
    }

    if(password.length < 6){

        authMsg(
            "Password must be at least 6 characters.",
            "error"
        );

        return;
    }

    authMsg(
        "Creating account..."
    );

    const {
        data,
        error
    } =
    await supabaseClient.auth.signUp({

        email,
        password,

        options:{
            emailRedirectTo:
                window.location.origin
        }

    });

    if(error){

        authMsg(
            error.message,
            "error"
        );

        return;
    }

    if(data.session){

        showApp(data.user);

    }else{

        authMsg(
            "Account created. Check your email to verify it.",
            "success"
        );

    }
}


/* =====================================================
   SIGN IN
===================================================== */

async function signIn(){

    const email =
        document.getElementById("email")
        .value
        .trim();

    const password =
        document.getElementById("password")
        .value;

    if(!email || !password){

        authMsg(
            "Enter your email and password.",
            "error"
        );

        return;
    }

    authMsg(
        "Signing in..."
    );

    const {
        data,
        error
    } =
    await supabaseClient.auth
        .signInWithPassword({

            email,
            password

        });

    if(error){

        authMsg(
            error.message,
            "error"
        );

        return;
    }

    showApp(data.user);
}


/* =====================================================
   GOOGLE LOGIN
===================================================== */

async function googleSignIn(){

    authMsg(
        "Opening Google..."
    );

    const {
        error
    } =
    await supabaseClient.auth
        .signInWithOAuth({

            provider:"google",

            options:{
                redirectTo:
                    window.location.origin
            }

        });

    if(error){

        authMsg(
            error.message,
            "error"
        );

    }
}


/* =====================================================
   AUTH STATE
===================================================== */

supabaseClient.auth.onAuthStateChange(
    function(event,session){

        if(session && session.user){

            showApp(
                session.user
            );

        }else{

            currentUser = null;

            authScreen.classList.remove(
                "hidden"
            );

        }

    }
);


/* =====================================================
   SHOW APP
===================================================== */

async function showApp(user){

    if(!user) return;

    currentUser =
        user;

    authScreen.classList.add(
        "hidden"
    );

    accountEmail.textContent =
        user.email || "User";

    await loadChats();
}


/* =====================================================
   SIGN OUT
===================================================== */

async function signOut(){

    await supabaseClient.auth.signOut();

    currentUser = null;

    currentChatId = null;

    messages.innerHTML = "";

    welcome.style.display =
        "block";

}


/* =====================================================
   NEW CHAT
===================================================== */

function newChat(){

    currentChatId = null;

    messages.innerHTML = "";

    welcome.style.display =
        "block";

    question.value = "";

    document.getElementById(
        "topTitle"
    ).textContent =
        "New chat";

    question.focus();

    closeMobileSidebar();
}


/* =====================================================
   SEND AI MESSAGE
===================================================== */

async function sendMessage(){

    const text =
        question.value.trim();

    if(!text) return;

    addMessage(
        "user",
        text
    );

    question.value = "";

    welcome.style.display =
        "none";

    sendButton.disabled = true;

    const thinking =
        addMessage(
            "bot",
            "Thinking... 🤔"
        );

    try{

        const response =
            await fetch(
                WORKER_URL,
                {

                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:JSON.stringify({
                        question:text
                    })

                }
            );

        const data =
            await response.json();

        if(!response.ok){

            throw new Error(
                data.error ||
                "AI request failed."
            );

        }

        let answer = "";

        if(
            data.choices &&
            data.choices[0] &&
            data.choices[0].message
        ){

            answer =
                data.choices[0]
                .message
                .content || "";

        }

        if(!answer)
            answer = data.response || "";

        if(!answer)
            answer = data.answer || "";

        if(!answer)
            answer = data.content || "";

        if(!answer){

            throw new Error(
                "No AI response received."
            );

        }

        thinking.innerHTML =
            formatText(answer);

        await saveChat(
            text,
            answer
        );

    }catch(error){

        thinking.innerHTML =
            "❌ " +
            escapeHTML(
                error.message
            );

    }

    sendButton.disabled = false;

    question.focus();

    scrollChat();
}


/* =====================================================
   ADD MESSAGE
===================================================== */

function addMessage(type,text){

    const wrapper =
        document.createElement("div");

    wrapper.className =
        "message " + type;

    const content =
        document.createElement("div");

    content.className =
        "message-content";

    if(type === "user"){

        content.textContent =
            text;

    }else{

        content.innerHTML =
            formatText(text);

    }

    wrapper.appendChild(content);

    messages.appendChild(wrapper);

    scrollChat();

    return content;
}


/* =====================================================
   SAVE CHAT
===================================================== */

async function saveChat(
    userText,
    aiText
){

    const key =
        "badmosh_chats_" +
        currentUser.id;

    const saved =
        JSON.parse(
            localStorage.getItem(key)
            || "[]"
        );

    if(!currentChatId){

        currentChatId =
            Date.now().toString();

        saved.unshift({

            id:currentChatId,

            title:
                userText.substring(
                    0,
                    45
                ),

            pinned:false,

            messages:[]

        });

    }

    const chat =
        saved.find(
            c =>
                c.id === currentChatId
        );

    if(chat){

        chat.messages.push({

            role:"user",

            content:userText

        });

        chat.messages.push({

            role:"assistant",

            content:aiText

        });

    }

    localStorage.setItem(
        key,
        JSON.stringify(saved)
    );

    chats = saved;

    renderHistory();
}


/* =====================================================
   LOAD CHAT HISTORY
===================================================== */

async function loadChats(){

    if(!currentUser)
        return;

    const key =
        "badmosh_chats_" +
        currentUser.id;

    chats =
        JSON.parse(
            localStorage.getItem(key)
            || "[]"
        );

    renderHistory();
}


/* =====================================================
   RENDER HISTORY
===================================================== */

function renderHistory(){

    history.innerHTML = "";

    pinnedHistory.innerHTML = "";

    const pinned =
        chats.filter(
            c => c.pinned
        );

    if(!pinned.length){

        pinnedHistory.innerHTML =
            '<div class="empty-history">No pinned chats</div>';

    }

    if(!chats.length){

        history.innerHTML =
            '<div class="empty-history">No chats yet</div>';

    }

    pinned.forEach(
        chat =>
            pinnedHistory.appendChild(
                createChatItem(chat)
            )
    );

    chats.forEach(
        chat =>
            history.appendChild(
                createChatItem(chat)
            )
    );
}


/* =====================================================
   CHAT ITEM
===================================================== */

function createChatItem(chat){

    const wrapper =
        document.createElement("div");

    wrapper.className =
        "chat-item";

    const open =
        document.createElement("button");

    open.className =
        "chat-open";

    open.textContent =
        (chat.pinned ? "📌 " : "") +
        (chat.title || "New chat");

    open.onclick =
        function(){

            openChat(
                chat.id
            );

        };

    const pin =
        document.createElement("button");

    pin.className =
        "chat-action";

    pin.textContent =
        chat.pinned
            ? "📌"
            : "☆";

    pin.title =
        "Pin chat";

    pin.onclick =
        function(){

            togglePin(
                chat.id
            );

        };

    const del =
        document.createElement("button");

    del.className =
        "chat-action";

    del.textContent =
        "×";

    del.title =
        "Delete chat";

    del.onclick =
        function(){

            deleteChat(
                chat.id
            );

        };

    wrapper.appendChild(open);
    wrapper.appendChild(pin);
    wrapper.appendChild(del);

    return wrapper;
}


/* =====================================================
   OPEN CHAT
===================================================== */

function openChat(id){

    const chat =
        chats.find(
            c => c.id === id
        );

    if(!chat) return;

    currentChatId =
        id;

    messages.innerHTML =
        "";

    welcome.style.display =
        "none";

    document.getElementById(
        "topTitle"
    ).textContent =
        chat.title || "Chat";

    chat.messages.forEach(
        message => {

            addMessage(
                message.role === "user"
                    ? "user"
                    : "bot",
                message.content
            );

        }
    );

    closeMobileSidebar();
}


/* =====================================================
   PIN
===================================================== */

function togglePin(id){

    chats =
        chats.map(
            chat => {

                if(chat.id === id){

                    return {
                        ...chat,
                        pinned:
                            !chat.pinned
                    };

                }

                return chat;

            }
        );

    saveHistory();

    renderHistory();
}


/* =====================================================
   DELETE ONE CHAT
===================================================== */

function deleteChat(id){

    if(
        !confirm(
            "Delete this chat?"
        )
    ){

        return;

    }

    chats =
        chats.filter(
            chat =>
                chat.id !== id
        );

    saveHistory();

    if(currentChatId === id){

        newChat();

    }

    renderHistory();
}


/* =====================================================
   CLEAR ALL HISTORY
===================================================== */

function clearAllHistory(){

    if(!currentUser)
        return;

    if(
        !confirm(
            "Delete ALL Badmosh AI chat history?"
        )
    ){

        return;

    }

    const key =
        "badmosh_chats_" +
        currentUser.id;

    localStorage.removeItem(key);

    chats = [];

    currentChatId = null;

    messages.innerHTML = "";

    welcome.style.display =
        "block";

    renderHistory();

    document.getElementById(
        "topTitle"
    ).textContent =
        "New chat";
}


/* =====================================================
   SAVE HISTORY
===================================================== */

function saveHistory(){

    if(!currentUser)
        return;

    localStorage.setItem(
        "badmosh_chats_" +
        currentUser.id,
        JSON.stringify(chats)
    );
}

/* =====================================================
   FORMAT
===================================================== */

function escapeHTML(text){

    const div =
        document.createElement(
            "div"
        );

    div.textContent =
        String(text ?? "");

    return div.innerHTML;
}


function formatText(text){

    let safe =
        escapeHTML(text);

    safe =
        safe.replace(
            /\*\*(.*?)\*\*/g,
            "<strong>$1</strong>"
        );

    safe =
        safe.replace(
            /\n/g,
            "<br>"
        );

    return safe;
}
